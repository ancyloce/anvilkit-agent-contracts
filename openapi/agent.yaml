openapi: 3.0.3
info:
  title: AnvilKit Agent API
  version: "1"
  description: |
    Public REST/SSE contract of anvilkit-agent-api (contracts.md §3). Initial protocol v1.
    Every object is strict: unknown members, duplicate members and null substitutes for
    absent optional fields are rejected. IDs are opaque strings; revisions, sequences and
    64-bit counters are canonical unsigned decimal strings; money is an integer quantity at
    scale 6 carried as a decimal string; timestamps are UTC RFC3339; digests are
    "sha256:" plus 64 lowercase hexadecimal characters. Scope comes from the authenticated
    principal, never from the request body. Public JSON is not ProtoJSON.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: operations
  - name: preparations
  - name: knowledge
  - name: memories
  - name: mcp
  - name: artifacts
  - name: recovery
  - name: finance
  - name: conversations

paths:
  /preparations:
    post:
      tags: [preparations]
      operationId: createPreparation
      summary: API-01 accept a prompt into a Preparation operation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePreparationRequest" }
      responses:
        "202":
          description: Accepted after intake inventory confirmation; the same commandId and digest return the original operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationView" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/Exhausted" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /preparations/{operationId}/answers:
    post:
      tags: [preparations]
      operationId: submitAnswer
      summary: API-06 submit a clarification answer bound to the current question set revision
      parameters:
        - $ref: "#/components/parameters/operationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitAnswerRequest" }
      responses:
        "202":
          description: Answer committed with its relay intent; one tracked Update follows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerReceipt" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /operations:
    post:
      tags: [operations]
      operationId: createOperation
      summary: API-02 create a generation, refinement, preview, release or local-check operation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOperationRequest" }
      responses:
        "202":
          description: Accepted; the same commandId and digest return the original operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationView" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/Exhausted" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /operations/{operationId}:
    get:
      tags: [operations]
      operationId: getOperation
      summary: API-03 one committed projection of the operation
      parameters:
        - $ref: "#/components/parameters/operationId"
      responses:
        "200":
          description: Current committed projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /operations/{operationId}/source:
    get:
      tags: [operations]
      operationId: readSource
      summary: The exact source archive a workbench edits (a generation's certified source or a preview build's edited source)
      parameters:
        - $ref: "#/components/parameters/operationId"
      responses:
        "200":
          description: The source archive (a tar of regular files under relative paths); its SHA-256 is the digest header.
          headers:
            AnvilKit-Source-Lineage:
              required: true
              schema: { $ref: "#/components/schemas/Digest" }
            AnvilKit-Source-Digest:
              required: true
              schema: { $ref: "#/components/schemas/Digest" }
            AnvilKit-Source-Revision:
              required: false
              schema: { $ref: "#/components/schemas/Revision" }
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /operations/{operationId}/preview:
    get:
      tags: [operations]
      operationId: getPreview
      summary: The committed preview of a preview_build operation (saved revision, state, exact artifacts)
      parameters:
        - $ref: "#/components/parameters/operationId"
      responses:
        "200":
          description: Current committed preview projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /operations/{operationId}/preview/artifacts/{digest}:
    get:
      tags: [operations]
      operationId: readPreviewArtifact
      summary: The verified bytes of the preview's module or one of its stylesheets
      parameters:
        - $ref: "#/components/parameters/operationId"
        - name: digest
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Digest" }
      responses:
        "200":
          description: The exact bytes (their SHA-256 is the path digest).
          content:
            text/javascript:
              schema:
                type: string
                format: binary
            text/css:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /operations/{operationId}/release:
    get:
      tags: [operations]
      operationId: getRelease
      summary: The committed release projection of a release operation (exact subject, approval, per-target receipts, activation)
      parameters:
        - $ref: "#/components/parameters/operationId"
      responses:
        "200":
          description: Current committed release projection. Approval, publication and activation are the source authority's facts as the release recorded them; a pending or unknown target is never shown as delivered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /operations/{operationId}/events:
    get:
      tags: [operations]
      operationId: streamOperationEvents
      summary: API-04 authorized SSE of durable operation events after a cursor
      description: |
        Server-Sent Events. The stream opens with a `retry` field (the reconnect interval in
        milliseconds, jittered). `id` carries the eventSeq cursor; reconnect with
        `Last-Event-ID` or `after`. Each `operation.changed` event's `data` is an
        OperationEventFrame. A cursor before retention yields one `reset_required` event
        whose data is a ResetFrame; fetch the snapshot and continue from coveredEventSeq.
        A stream the server ends on its own (reason `server_shutdown`: the replica drains)
        ends with one `end` event whose data is an EndFrame and carries no `id`; the client
        reconnects after the advertised `retry` interval with its last event id, to any
        replica, and loses nothing. A stream whose operation became terminal closes after
        its last `operation.changed` event without an `end` event. Comment lines are
        heartbeats. Slow consumers are disconnected; disconnection never cancels the
        operation.
      parameters:
        - $ref: "#/components/parameters/operationId"
        - name: after
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Sequence" }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { $ref: "#/components/schemas/Sequence" }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /operations/{operationId}/commands:
    post:
      tags: [operations]
      operationId: submitCommand
      summary: API-05 submit a tracked control command
      parameters:
        - $ref: "#/components/parameters/operationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitCommandRequest" }
      responses:
        "202":
          description: Tracked; acceptance does not mean execution or spending stopped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandReceipt" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /operations/{operationId}/commands/{commandId}:
    get:
      tags: [operations]
      operationId: getCommand
      summary: Query the original tracked command
      parameters:
        - $ref: "#/components/parameters/operationId"
        - name: commandId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: Original command receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /knowledge/sources:
    get:
      tags: [knowledge]
      operationId: listSources
      summary: API-07 the sources the caller may read, with ACL revision and ingest state
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Source page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourcePage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [knowledge]
      operationId: registerSource
      summary: API-07 register an approved source reference for ingestion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterSourceRequest" }
      responses:
        "202":
          description: Ingest request committed with the trusted ACL snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /knowledge/sources/{sourceId}:
    get:
      tags: [knowledge]
      operationId: getSource
      summary: Read a source with its current ACL revision and ingest state
      parameters:
        - $ref: "#/components/parameters/sourceId"
      responses:
        "200":
          description: Source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [knowledge]
      operationId: deleteSource
      summary: API-14 block readability now; projections are cleared asynchronously
      parameters:
        - $ref: "#/components/parameters/sourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteSourceRequest" }
      responses:
        "200":
          description: Source marked deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /knowledge/sources/{sourceId}/access:
    put:
      tags: [knowledge]
      operationId: replaceSourceAccess
      summary: API-13 replace the trusted ACL under an expected ACL revision
      parameters:
        - $ref: "#/components/parameters/sourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceSourceAccessRequest" }
      responses:
        "200":
          description: ACL replaced; revocation applies on the next read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /knowledge/sources/uploads:
    post:
      tags: [knowledge]
      operationId: beginSourceUpload
      summary: API-08 a single-use upload capability for one document (P2.6)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeginSourceUploadRequest" }
      responses:
        "201":
          description: The capability; registerSource with locator upload:<uploadId> consumes it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceUpload" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /knowledge/snapshots:
    post:
      tags: [knowledge]
      operationId: createSnapshot
      summary: API-08 freeze exact source revisions for retrieval (P2.6)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSnapshotRequest" }
      responses:
        "201":
          description: Snapshot; authorization is rechecked on every read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /knowledge/snapshots/{snapshotId}:
    get:
      tags: [knowledge]
      operationId: getSnapshot
      summary: API-08 read a snapshot (P2.6)
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: Snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /knowledge/searches:
    post:
      tags: [knowledge]
      operationId: search
      summary: API-08 cited context under current authorization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: Cited context; no unauthorized counts or text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /memories:
    get:
      tags: [memories]
      operationId: listMemories
      summary: API-09 memory facts the caller may see, by subject and state
      parameters:
        - name: subjectType
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: subjectId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Id" }
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/FactState" }
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Memory page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [memories]
      operationId: proposeMemory
      summary: API-09 propose a memory fact; models never confirm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposeMemoryRequest" }
      responses:
        "201":
          description: Proposed fact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryFact" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /memories/recalls:
    post:
      tags: [memories]
      operationId: recallMemories
      summary: API-09 recall confirmed facts under current authorization (P2.6)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecallMemoriesRequest" }
      responses:
        "200":
          description: Recallable facts; no unauthorized counts or content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecallMemoriesResponse" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /memories/{factId}/decisions:
    post:
      tags: [memories]
      operationId: decideMemory
      summary: API-09 authorized confirm, reject or revoke under expected revision
      parameters:
        - name: factId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryDecisionRequest" }
      responses:
        "200":
          description: Fact after the decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryFact" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /mcp/catalog:
    get:
      tags: [mcp]
      operationId: listCatalog
      summary: API-10 visible reviewed catalog; visibility is not a grant
      parameters:
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CatalogState" }
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Catalog page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /mcp/catalog/discoveries:
    post:
      tags: [mcp]
      operationId: discoverServer
      summary: API-15 record the live descriptor of a server as a revision awaiting review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoverServerRequest" }
      responses:
        "201":
          description: The discovered (or identical existing) revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Descriptor" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /mcp/catalog/{serverId}/reviews:
    post:
      tags: [mcp]
      operationId: reviewDescriptor
      summary: API-15 authorized review decision bound to the exact descriptor digest
      parameters:
        - name: serverId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDescriptorRequest" }
      responses:
        "200":
          description: Descriptor after the review decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Descriptor" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /mcp/grants:
    get:
      tags: [mcp]
      operationId: listGrants
      summary: API-16 grants the caller may see
      parameters:
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/GrantState" }
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Grant page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [mcp]
      operationId: createGrant
      summary: API-10 create a grant bound to a descriptor revision and method scope
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGrantRequest" }
      responses:
        "201":
          description: Grant; active only after Control's registration receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /mcp/grants/{grantId}:
    get:
      tags: [mcp]
      operationId: getGrant
      summary: Read a grant and its revocation progress
      parameters:
        - $ref: "#/components/parameters/grantId"
      responses:
        "200":
          description: Grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /mcp/grants/{grantId}/revocation:
    get:
      tags: [mcp]
      operationId: getRevocationProgress
      summary: API-16 blocked new admission versus converged senders of a grant's revocation
      parameters:
        - $ref: "#/components/parameters/grantId"
      responses:
        "200":
          description: Revocation progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationProgress" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /mcp/grants/{grantId}/revocations:
    post:
      tags: [mcp]
      operationId: revokeGrant
      summary: API-16 revoke; new admission is blocked immediately, convergence is tracked
      parameters:
        - $ref: "#/components/parameters/grantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeGrantRequest" }
      responses:
        "202":
          description: Revocation committed as REVOKING; the receipt distinguishes blocked admission from converged senders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /mcp/calls:
    post:
      tags: [mcp]
      operationId: createToolCall
      summary: API-11 create a tracked tool call
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateToolCallRequest" }
      responses:
        "202":
          description: Tracked call; querying its outcome never sends again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolCall" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/Exhausted" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /mcp/calls/{callId}:
    get:
      tags: [mcp]
      operationId: getToolCall
      summary: API-11 query the original call outcome
      parameters:
        - name: callId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: Call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolCall" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /mcp/calls/{callId}/reconciliations:
    post:
      tags: [mcp]
      operationId: reconcileToolCall
      summary: API-11 operator reconciliation of one call (P1.2, P2.5)
      description: >-
        Advances one open call now under its original identity from Control's
        record (an UNKNOWN call is resolved only from Control's dispatch
        record) and returns its state. Never sends anything upstream. Needs
        the call-operator role in the call's tenant.
      parameters:
        - name: callId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: The call after reconciliation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolCall" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /artifacts/transfers:
    post:
      tags: [artifacts]
      operationId: beginTransfer
      summary: API-12 begin a scoped artifact transfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeginTransferRequest" }
      responses:
        "201":
          description: Transfer with an opaque handle; trusted flows also receive a scoped capability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /artifacts/{handle}/finalizations:
    post:
      tags: [artifacts]
      operationId: finalizeTransfer
      summary: API-12 finalize after verifying actual bytes, size, hash and object version
      parameters:
        - name: handle
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Handle" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinalizeTransferRequest" }
      responses:
        "200":
          description: Finalized transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /recoveries:
    post:
      tags: [recovery]
      operationId: beginRecovery
      summary: API-17 begin an operator recovery run of a rollback window (F-P3.7-1)
      description: >-
        Closes new admission for the scope and fences every active execution
        identity under a new recovery epoch in one commit; the RecoveryWorkflow
        then enumerates the five independent inventories of the window and
        reconciles each finding under its original identity. The scope is the
        principal's tenant, or every tenant with `allTenants`. Control decides
        the authorization from the principal's verified roles: `operator` in
        the tenant, `platform_operator` for every tenant. The same commandId
        and body returns the existing run (200); a second run while one holds
        the scope is STALE_EXECUTION (RECOVERY_IN_PROGRESS).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeginRecoveryRequest" }
      responses:
        "200":
          description: The run this command already began.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryRun" }
        "201":
          description: The new run, phase fenced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryRun" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /recoveries/{runId}:
    get:
      tags: [recovery]
      operationId: getRecovery
      summary: API-17 read a recovery run, its enumeration progress and unsettled findings
      description: >-
        Disclosed only to an operator of the run's scope; any other caller
        receives NOT_FOUND.
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryRun" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /recoveries/{runId}/findings:
    get:
      tags: [recovery]
      operationId: listRecoveryFindings
      summary: API-17 page a run's findings in their fixed (class, obligation) order
      description: >-
        A caller that follows nextCursor until complete reaches every finding
        whatever the state of the ones before it. Disclosed only to an operator
        of the run's scope.
      parameters:
        - $ref: "#/components/parameters/runId"
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/FindingStatus" }
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Finding page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /recoveries/{runId}/dispositions:
    post:
      tags: [recovery]
      operationId: disposeObligation
      summary: API-17 record an evidence-bound operator disposition of one obligation of a run
      description: >-
        One obligation per command; there is no bulk form. The decision must
        apply to the obligation's class, the evidence reference and digest are
        verified before anything is recorded (a not-sent confirmation against
        the dispatch owner's independently checkable evidence), and the
        recoveryEpoch must be the obligation's current one. Needs the operator
        role in the principal's tenant. Evidence that does not verify is refused
        with EFFECT_UNCERTAIN and nothing is recorded: the obligation keeps its
        exposure. The same commandId and body returns the existing disposition
        (200).
      parameters:
        - $ref: "#/components/parameters/runId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisposeObligationRequest" }
      responses:
        "200":
          description: The disposition this command already recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Disposition" }
        "201":
          description: The recorded disposition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Disposition" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /budget-pools:
    post:
      tags: [finance]
      operationId: createBudgetPool
      summary: Create a USD budget pool of one level and period (DEC-066)
      description: >-
        Operations are funded from a current platform, tenant and actor pool
        each. Control decides the authorization from the principal's verified
        roles: only `platform_operator` may create a pool. The same scope,
        period start, period end and cap returns the existing pool (200); a pool
        of the same scope and period start with other terms is
        IDEMPOTENCY_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBudgetPoolRequest" }
      responses:
        "200":
          description: The existing pool with the same terms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetPool" }
        "201":
          description: The new pool.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetPool" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [finance]
      operationId: findBudgetPool
      summary: Read the budget pool of one scope and period start
      description: >-
        Needs `platform_operator`, or `operator` for a pool of the principal's
        own tenant. NOT_FOUND when no pool has that scope and period start.
      parameters:
        - $ref: "#/components/parameters/budgetLevel"
        - $ref: "#/components/parameters/poolTenantId"
        - $ref: "#/components/parameters/poolActorId"
        - $ref: "#/components/parameters/periodStart"
      responses:
        "200":
          description: Pool.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetPool" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /budget-pools/{poolId}/adjustments:
    post:
      tags: [finance]
      operationId: adjustBudgetPool
      summary: Set a budget pool's cap conditionally on its revision
      description: >-
        Only `platform_operator`. A cap below the allocated amount fences new
        allocations only. Another current revision is REVISION_CONFLICT, which a
        retried success also receives.
      parameters:
        - $ref: "#/components/parameters/poolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustBudgetPoolRequest" }
      responses:
        "200":
          description: The adjusted pool.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetPool" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /credit-pools:
    post:
      tags: [finance]
      operationId: createCreditPool
      summary: Create a credit pool of one tenant or actor and period (DEC-066)
      description: >-
        Credits count funded operations, separate from USD spend: funding
        debits a profile's credits (0 for a Preparation, 1 for a Generation or
        Refinement by default) from the current tenant and actor credit pools,
        and a debited credit is never refunded. A missing or exhausted credit
        pool refuses the funding with BUDGET_EXHAUSTED. Only
        `platform_operator`. The same scope, period and limit returns the
        existing pool (200); other terms are IDEMPOTENCY_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCreditPoolRequest" }
      responses:
        "200":
          description: The existing pool with the same terms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditPool" }
        "201":
          description: The new pool.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditPool" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [finance]
      operationId: findCreditPool
      summary: Read the credit pool of one scope and period start
      description: >-
        Needs `platform_operator`, or `operator` for a pool of the principal's
        own tenant. NOT_FOUND when no credit pool has that scope and period
        start.
      parameters:
        - $ref: "#/components/parameters/creditLevel"
        - $ref: "#/components/parameters/creditTenantId"
        - $ref: "#/components/parameters/poolActorId"
        - $ref: "#/components/parameters/periodStart"
      responses:
        "200":
          description: Credit pool.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditPool" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /credit-pools/{creditPoolId}/adjustments:
    post:
      tags: [finance]
      operationId: adjustCreditPool
      summary: Set a credit pool's limit conditionally on its revision
      description: >-
        Only `platform_operator`. A limit below the used count fences new debits
        only. Another current revision is REVISION_CONFLICT, which a retried
        success also receives.
      parameters:
        - $ref: "#/components/parameters/creditPoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustCreditPoolRequest" }
      responses:
        "200":
          description: The adjusted credit pool.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditPool" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      summary: The caller's conversations in the caller's project, newest first
      description: >-
        A conversation is personal (DEC-067): only its creator, in the creator's tenant and
        project, can list or read it. Without `status` both active and archived
        conversations are listed. The order is creation time, newest first, so a page never
        moves under later activity.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ConversationStatus" }
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/historyLimit"
      responses:
        "200":
          description: Conversation page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [conversations]
      operationId: createConversation
      summary: Create a personal conversation in the caller's project
      description: >-
        The tenant, project and owner come from the verified principal. The same commandId
        and body returns the existing conversation; another body is IDEMPOTENCY_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationRequest" }
      responses:
        "201":
          description: The conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /conversations/{conversationId}:
    get:
      tags: [conversations]
      operationId: getConversation
      summary: One of the caller's conversations
      parameters:
        - $ref: "#/components/parameters/conversationId"
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      tags: [conversations]
      operationId: updateConversation
      summary: Rename, archive or restore a conversation conditionally on its revision
      description: >-
        At least one of `title` and `status` is present. An archived conversation accepts no
        new message until it is restored to `active`; its history stays readable. Another
        current revision is REVISION_CONFLICT. The same commandId and body returns the
        conversation as it is now.
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConversationRequest" }
      responses:
        "200":
          description: The updated conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /conversations/{conversationId}/messages:
    get:
      tags: [conversations]
      operationId: listMessages
      summary: A page of a conversation's history, oldest first within the page
      description: >-
        Without `beforeMessageSeq` the page holds the newest messages; `nextBeforeMessageSeq`
        names the page before it. A page also ends early when its message text reaches
        1 MiB of UTF-8, and always holds at least one message when any precedes the cursor.
      parameters:
        - $ref: "#/components/parameters/conversationId"
        - name: beforeMessageSeq
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Sequence" }
        - $ref: "#/components/parameters/historyLimit"
      responses:
        "200":
          description: Message page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [conversations]
      operationId: appendMessage
      summary: Add the caller's text message to an active conversation
      description: >-
        The message is the caller's own; a request names no role. The text is at most
        32768 bytes of UTF-8 (INVALID_ARGUMENT above it). Another current revision is
        REVISION_CONFLICT; a message to an archived conversation is INVALID_ARGUMENT. The
        same commandId and body returns the original receipt. Where assistant replies are
        enabled (DEC-068), the message opens one turn and the receipt names its `turnId` and
        `operationId`. While the conversation's previous turn is unfinished the message is
        refused with CAPACITY_EXHAUSTED (retryable; its message begins `TURN_BUSY:`) and
        nothing is stored. Where replies are disabled, a receipt names no turn.
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppendMessageRequest" }
      responses:
        "201":
          description: The stored message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageReceipt" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/Exhausted" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /conversations/{conversationId}/messages/{messageId}:
    get:
      tags: [conversations]
      operationId: getMessage
      summary: One message of the caller's conversation
      description: >-
        D4 (DEC-070). A `streaming` assistant message answers the text committed so far, with
        its `contentRevision` and `throughChunkSeq`; a sealed one answers its sealed text. Another
        user's or tenant's message is NOT_FOUND with no body.
      parameters:
        - $ref: "#/components/parameters/conversationId"
        - $ref: "#/components/parameters/messageId"
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /conversations/{conversationId}/events:
    get:
      tags: [conversations]
      operationId: streamConversationEvents
      summary: SSE of the caller's conversation events after a cursor
      description: |
        Server-Sent Events (design 0001 §8, D4a, DEC-070). The stream opens with a `retry` field
        (the reconnect interval in milliseconds, jittered). `id` carries the eventSeq cursor; the
        SSE `event` field names the event type, and its `data` is a ConversationEventFrame:
        `message.accepted`, `message.started`, `message.delta` (the text of one committed chunk),
        `message.completed`, `message.failed`, `message.canceled`, `turn.changed` and
        `conversation.changed`. Later phases add types; a client skips a type it does not know.
        Only text committed in Control is sent. Reconnect with `Last-Event-ID` or `after`, each a
        plain eventSeq; a request that carries both with different values is refused
        INVALID_ARGUMENT. A cursor ahead of the conversation's events or past a gap yields one
        `reset_required` event whose data is a ConversationResetFrame: read the conversation
        (its `coveredEventSeq`) and continue from there. A stream the server ends on its own
        (reason `server_shutdown`) ends with one `end` event whose data is a ConversationEndFrame
        and carries no `id`; the client reconnects after the advertised `retry` interval with its
        last event id, to any replica, and loses nothing. A conversation has no terminal state,
        so the stream does not end on its own. Comment lines are heartbeats. Slow consumers are
        disconnected; disconnection never stops a turn.
      parameters:
        - $ref: "#/components/parameters/conversationId"
        - name: after
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Sequence" }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { $ref: "#/components/schemas/Sequence" }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /conversations/{conversationId}/turns/{turnId}:
    get:
      tags: [conversations]
      operationId: getTurn
      summary: One turn of the caller's conversation
      description: >-
        The reply's aggregate state, with its content, sender and financial facts reported
        separately (design 0001 §7.4): a terminal turn can still have its operation's finance
        unsettled. Only `completed` means a complete reply.
      parameters:
        - $ref: "#/components/parameters/conversationId"
        - $ref: "#/components/parameters/turnId"
      responses:
        "200":
          description: Turn view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Turn" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /conversations/{conversationId}/turns/{turnId}/cancellations:
    post:
      tags: [conversations]
      operationId: stopTurn
      summary: Stop this turn's reply
      description: >-
        Stops this reply only (design 0001 §11.3); a running generation is not affected. Text
        already shown stays, and incurred usage stays in the ledger; the turn view reports
        when the sender is proven stopped. A terminal turn answers itself unchanged. The same
        commandId and body returns the original answer.
      parameters:
        - $ref: "#/components/parameters/conversationId"
        - $ref: "#/components/parameters/turnId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StopTurnRequest" }
      responses:
        "202":
          description: The stop was recorded; the turn as it stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Turn" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Verified through the real IdP protocol (A12); a local fixture issuer is development-only.

  parameters:
    operationId:
      name: operationId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    sourceId:
      name: sourceId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    grantId:
      name: grantId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    runId:
      name: runId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    poolId:
      name: poolId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    creditPoolId:
      name: creditPoolId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    conversationId:
      name: conversationId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    turnId:
      name: turnId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    messageId:
      name: messageId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    historyLimit:
      name: limit
      in: query
      required: false
      description: Default 20 for conversations and 30 for messages.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    budgetLevel:
      name: level
      in: query
      required: true
      schema: { $ref: "#/components/schemas/BudgetLevel" }
    creditLevel:
      name: level
      in: query
      required: true
      schema: { $ref: "#/components/schemas/CreditLevel" }
    poolTenantId:
      name: tenantId
      in: query
      required: false
      description: The pool's tenant; absent for a platform pool.
      schema: { $ref: "#/components/schemas/Id" }
    creditTenantId:
      name: tenantId
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    poolActorId:
      name: actorId
      in: query
      required: false
      description: The pool's actor; present only for an actor pool.
      schema: { $ref: "#/components/schemas/Id" }
    periodStart:
      name: periodStart
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Timestamp" }
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200

  responses:
    InvalidArgument:
      description: INVALID_ARGUMENT
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthenticated:
      description: UNAUTHENTICATED
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: FORBIDDEN
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: NOT_FOUND (scope-bound; existence outside the caller's scope is not disclosed)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: REVISION_CONFLICT or IDEMPOTENCY_CONFLICT or STALE_EXECUTION
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Exhausted:
      description: CAPACITY_EXHAUSTED or BUDGET_EXHAUSTED
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unavailable:
      description: DEPENDENCY_UNAVAILABLE
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    # ---- values ----
    Id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
    Handle:
      type: string
      minLength: 1
      maxLength: 256
      pattern: "^[A-Za-z0-9._:-]+$"
    Digest:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
    Sequence:
      description: Canonical unsigned decimal string, no leading zeros, bounded by uint64.
      type: string
      pattern: "^(0|[1-9][0-9]{0,19})$"
    Revision:
      $ref: "#/components/schemas/Sequence"
    Timestamp:
      type: string
      format: date-time
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,9})?Z$"
    Money:
      type: object
      additionalProperties: false
      required: [currency, amount]
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        amount:
          description: Integer quantity at scale 6 as a decimal string; never a float.
          type: string
          pattern: "^-?(0|[1-9][0-9]{0,29})$"
    ArtifactBinding:
      description: A finalized transfer and the digest the caller expects it to hold.
      type: object
      additionalProperties: false
      required: [transferId, digest]
      properties:
        transferId: { $ref: "#/components/schemas/Id" }
        digest: { $ref: "#/components/schemas/Digest" }
    SourceReference:
      type: object
      additionalProperties: false
      required: [sourceId, revision]
      properties:
        sourceId: { $ref: "#/components/schemas/Id" }
        revision: { $ref: "#/components/schemas/Revision" }

    # ---- errors ----
    ErrorCode:
      type: string
      enum:
        - INVALID_ARGUMENT
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - REVISION_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - CAPACITY_EXHAUSTED
        - BUDGET_EXHAUSTED
        - STALE_EXECUTION
        - PROFILE_UNQUALIFIED
        - EFFECT_UNCERTAIN
        - DEPENDENCY_UNAVAILABLE
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId, retryable]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              maxLength: 512
            requestId: { $ref: "#/components/schemas/Id" }
            retryable:
              type: boolean
            details:
              description: Allowlisted detail fields only; never source text, upstream bodies or credentials.
              type: object
              additionalProperties: false
              properties:
                field:
                  type: string
                  maxLength: 128
                expectedRevision: { $ref: "#/components/schemas/Revision" }
                currentRevision: { $ref: "#/components/schemas/Revision" }
                coveredEventSeq: { $ref: "#/components/schemas/Sequence" }

    # ---- operations ----
    OperationKind:
      type: string
      enum: [preparation, generation, refinement, preview_build, release, local_check]
    Lifecycle:
      type: string
      enum: [accepted, running, waiting, reconciling, suspended, succeeded, failed, canceled]
    ControlState:
      type: string
      enum: [none, cancel_pending, cancel_applied, hold_pending, hold_applied]
    CleanupState:
      type: string
      enum: [not_required, pending, complete, unknown]
    FinanceState:
      type: string
      enum: [not_funded, funded, settling, settled, exposure_unknown]
    OperationSubject:
      type: object
      additionalProperties: false
      required: [profileId, subjectDigest]
      properties:
        profileId: { $ref: "#/components/schemas/Id" }
        subjectDigest: { $ref: "#/components/schemas/Digest" }
        briefId: { $ref: "#/components/schemas/Id" }
        sourceRevision: { $ref: "#/components/schemas/Revision" }
        sourceHandle:
          description: preview_build only - the finalized source artifact holding the edited source; subjectDigest names the component source lineage it edits and sourceRevision the revision the edit was based on.
          $ref: "#/components/schemas/Handle"
        sourceOperationId:
          description: release only - the preview_build, generation or refinement operation whose saved or registered source is released; subjectDigest and sourceRevision must be that operation's lineage and source revision. Control binds the source artifact itself.
          $ref: "#/components/schemas/Id"
        packageVersion:
          description: release only - the exact package version released; the certified source must declare it.
          type: string
          maxLength: 64
          pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$"
        refinementBase:
          description: refinement, and the view of a preparation that analyzes a change - the base. A refinement's subjectDigest must be the base's lineage and its briefId the brief of a preparation that named the same base; Control binds the base's source artifact itself. sourceRevision and sourceOperationId are not set with it.
          $ref: "#/components/schemas/RefinementBase"
    OperationView:
      type: object
      additionalProperties: false
      required:
        - operationId
        - tenantId
        - actorId
        - kind
        - subject
        - lifecycle
        - phase
        - control
        - cleanup
        - finance
        - revision
        - coveredEventSeq
        - executionEpoch
        - createdAt
        - updatedAt
        - deadline
      properties:
        operationId: { $ref: "#/components/schemas/Id" }
        tenantId: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        actorId: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/OperationKind" }
        subject: { $ref: "#/components/schemas/OperationSubject" }
        lifecycle: { $ref: "#/components/schemas/Lifecycle" }
        phase:
          type: string
          maxLength: 64
        control: { $ref: "#/components/schemas/ControlState" }
        cleanup: { $ref: "#/components/schemas/CleanupState" }
        finance: { $ref: "#/components/schemas/FinanceState" }
        revision: { $ref: "#/components/schemas/Revision" }
        coveredEventSeq: { $ref: "#/components/schemas/Sequence" }
        executionEpoch: { $ref: "#/components/schemas/Sequence" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        deadline: { $ref: "#/components/schemas/Timestamp" }
        failureCode:
          type: string
          maxLength: 64
        activeDeadline: { $ref: "#/components/schemas/Timestamp" }
        clarification:
          $ref: "#/components/schemas/Clarification"
        progress:
          $ref: "#/components/schemas/OperationProgress"
    Question:
      type: object
      additionalProperties: false
      required: [questionId, text]
      properties:
        questionId: { $ref: "#/components/schemas/Id" }
        text:
          type: string
          minLength: 1
          maxLength: 2048
    Clarification:
      description: The open question set of a waiting preparation; expiresAt is the immutable absolute end of the wait for this round.
      type: object
      additionalProperties: false
      required: [questionSetId, questionSetRevision, round, askedAt, expiresAt, questions]
      properties:
        questionSetId: { $ref: "#/components/schemas/Id" }
        questionSetRevision: { $ref: "#/components/schemas/Revision" }
        round: { $ref: "#/components/schemas/Sequence" }
        askedAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        questions:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/Question" }
    CreatePreparationRequest:
      type: object
      additionalProperties: false
      required: [commandId, prompt]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        prompt: { $ref: "#/components/schemas/ArtifactBinding" }
        brandReferences:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/SourceReference" }
        assetReferences:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/SourceReference" }
        refinementBase: { $ref: "#/components/schemas/RefinementBase" }
    RefinementBase:
      description: The delivered component a change starts from, named the same way by the preparation that analyzes the change and by the refinement that makes it. The brief such a preparation freezes keeps that component's identity, declares the base's version with the patch number raised by one, and starts only a refinement that names the same base. The analysis reads the base's frozen requirements as data.
      type: object
      additionalProperties: false
      required: [sourceOperationId, sourceRevision]
      properties:
        sourceOperationId:
          description: The generation or refinement operation whose registered source is the base.
          $ref: "#/components/schemas/Id"
        sourceRevision:
          description: The exact revision the source authority registered for that operation's source.
          $ref: "#/components/schemas/Revision"
    CreateOperationRequest:
      type: object
      additionalProperties: false
      required: [commandId, kind, subject]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        kind:
          type: string
          enum: [generation, refinement, preview_build, release, local_check]
        subject: { $ref: "#/components/schemas/OperationSubject" }
    CommandKind:
      type: string
      enum: [cancel, hold, resume, change_definition]
    CommandOutcome:
      type: string
      enum: [pending, applied, blocked, rejected]
    SubmitCommandRequest:
      type: object
      additionalProperties: false
      required: [commandId, kind, expectedRevision]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/CommandKind" }
        expectedRevision: { $ref: "#/components/schemas/Revision" }
        targetDefinitionActivation: { $ref: "#/components/schemas/Id" }
    CommandReceipt:
      type: object
      additionalProperties: false
      required: [commandId, operationId, kind, outcome, operationRevision, acceptedAt]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        operationId: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/CommandKind" }
        outcome: { $ref: "#/components/schemas/CommandOutcome" }
        operationRevision: { $ref: "#/components/schemas/Revision" }
        reasonCode:
          type: string
          maxLength: 64
        acceptedAt: { $ref: "#/components/schemas/Timestamp" }
        settledAt: { $ref: "#/components/schemas/Timestamp" }
    OperationEventFrame:
      description: The `data` of an SSE `operation.changed` event.
      type: object
      additionalProperties: false
      required: [operationId, eventSeq, transitionId, eventType, revision, occurredAt, payload]
      properties:
        operationId: { $ref: "#/components/schemas/Id" }
        eventSeq: { $ref: "#/components/schemas/Sequence" }
        transitionId: { $ref: "#/components/schemas/Id" }
        eventType:
          type: string
          enum: [operation.changed]
        revision: { $ref: "#/components/schemas/Revision" }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
        payload:
          type: object
          additionalProperties: false
          required: [lifecycle, phase, control, cleanup, finance]
          properties:
            lifecycle: { $ref: "#/components/schemas/Lifecycle" }
            phase:
              type: string
              maxLength: 64
            control: { $ref: "#/components/schemas/ControlState" }
            cleanup: { $ref: "#/components/schemas/CleanupState" }
            finance: { $ref: "#/components/schemas/FinanceState" }
            failureCode:
              type: string
              maxLength: 64
            # Attempt-bound facts (plan 0005 Phase 2), present on the transitions
            # Control commits for an attempt and on intra-Job progress reports,
            # absent elsewhere: the step id, the outer repair round (visit, "0"
            # first) and the rerun of that visit (attemptOrdinal, "1" first).
            step:
              type: string
              maxLength: 64
            visit: { $ref: "#/components/schemas/Sequence" }
            attemptOrdinal: { $ref: "#/components/schemas/Sequence" }
            # verdict and verdictCode describe an accepted result only: a codegen
            # step's verdict is the team's own classification, a validate step's
            # the independent Validator's. Never a completion signal by itself.
            verdict: { $ref: "#/components/schemas/StageVerdict" }
            verdictCode:
              type: string
              maxLength: 64
            # The trusted coordinator's node boundary inside a codegen attempt
            # (progress for display, never a verdict), its internal coding round
            # ("1" first) and a controlled outcome code of a failed or classified
            # node.
            node: { $ref: "#/components/schemas/ProgressNode" }
            nodeState: { $ref: "#/components/schemas/ProgressNodeState" }
            round: { $ref: "#/components/schemas/Sequence" }
            outcomeCode:
              type: string
              maxLength: 64
    StageVerdict:
      type: string
      enum: [certified, repairable, invalid, infrastructure_failed, canceled]
    ProgressNode:
      type: string
      enum: [planner, retrieve, code, review, validate]
    ProgressNodeState:
      type: string
      enum: [started, completed, failed, skipped]
    OperationProgress:
      description: The latest attempt-bound fact of the operation (the newest event carrying a step) and the event sequence it comes from, so a client that lost history still learns the current step and node.
      type: object
      additionalProperties: false
      required: [step, visit, attemptOrdinal, eventSeq]
      properties:
        step:
          type: string
          maxLength: 64
        visit: { $ref: "#/components/schemas/Sequence" }
        attemptOrdinal: { $ref: "#/components/schemas/Sequence" }
        node: { $ref: "#/components/schemas/ProgressNode" }
        nodeState: { $ref: "#/components/schemas/ProgressNodeState" }
        round: { $ref: "#/components/schemas/Sequence" }
        eventSeq: { $ref: "#/components/schemas/Sequence" }
    ResetFrame:
      description: The `data` of an SSE `reset_required` event.
      type: object
      additionalProperties: false
      required: [operationId, coveredEventSeq]
      properties:
        operationId: { $ref: "#/components/schemas/Id" }
        coveredEventSeq: { $ref: "#/components/schemas/Sequence" }
    EndFrame:
      description: The `data` of an SSE `end` event; the stream closes after it and is resumed from the last event id.
      type: object
      additionalProperties: false
      required: [operationId, reason]
      properties:
        operationId: { $ref: "#/components/schemas/Id" }
        reason:
          type: string
          enum: [server_shutdown]
    SubmitAnswerRequest:
      type: object
      additionalProperties: false
      required: [commandId, questionSetId, questionSetRevision, answer]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        questionSetId: { $ref: "#/components/schemas/Id" }
        questionSetRevision: { $ref: "#/components/schemas/Revision" }
        answer: { $ref: "#/components/schemas/ArtifactBinding" }
    AnswerReceipt:
      type: object
      additionalProperties: false
      required: [answerId, operationId, questionSetId, questionSetRevision, updateId, acceptedAt]
      properties:
        answerId: { $ref: "#/components/schemas/Id" }
        operationId: { $ref: "#/components/schemas/Id" }
        questionSetId: { $ref: "#/components/schemas/Id" }
        questionSetRevision: { $ref: "#/components/schemas/Revision" }
        updateId: { $ref: "#/components/schemas/Id" }
        acceptedAt: { $ref: "#/components/schemas/Timestamp" }

    # ---- knowledge ----
    SourceKind:
      # P2.6: the implemented kinds only (an uploaded document).
      type: string
      enum: [document]
    # P2.6 (CON-02): exact provenance <sourceId>@<revision>, the same pattern
    # as anvilkit.knowledge.v1 (ProposeFactRequest.source_refs).
    SourceRef:
      type: string
      maxLength: 148
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}@[1-9][0-9]{0,18}$"
    BeginSourceUploadRequest:
      type: object
      additionalProperties: false
      required: [commandId, contentDigest, sizeBytes, mediaType]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        contentDigest: { $ref: "#/components/schemas/Digest" }
        sizeBytes: { $ref: "#/components/schemas/Sequence" }
        mediaType:
          type: string
          minLength: 1
          maxLength: 128
    SourceUpload:
      type: object
      additionalProperties: false
      required: [uploadId, uploadUrl, uploadMethod, uploadHeaders, expiresAt]
      properties:
        uploadId: { $ref: "#/components/schemas/Id" }
        uploadUrl:
          description: The single-use capability; a trusted caller performs the PUT with exactly uploadHeaders before expiresAt.
          type: string
          maxLength: 4096
        uploadMethod:
          type: string
          enum: [PUT]
        uploadHeaders:
          type: object
          additionalProperties:
            type: string
            maxLength: 512
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    CreateSnapshotRequest:
      type: object
      additionalProperties: false
      required: [commandId, sourceIds]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        sourceIds:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/Id" }
    Snapshot:
      type: object
      additionalProperties: false
      required: [snapshotId, tenantId, indexGeneration, sourceRevisions, contentDigest, createdAt]
      properties:
        snapshotId: { $ref: "#/components/schemas/Id" }
        tenantId: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        indexGeneration: { $ref: "#/components/schemas/Sequence" }
        sourceRevisions:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/SourceRef" }
        contentDigest: { $ref: "#/components/schemas/Digest" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    IngestState:
      type: string
      enum: [pending, parsing, indexing, indexed, failed, stale]
    AccessEntry:
      type: object
      additionalProperties: false
      required: [principalType, principalId]
      properties:
        principalType:
          type: string
          enum: [tenant, project, actor, role]
        principalId: { $ref: "#/components/schemas/Id" }
        permission:
          description: P2.7 read (the default) or manage (read, replace the access list, delete); the registering actor owns the source.
          type: string
          enum: [read, manage]
    RegisterSourceRequest:
      type: object
      additionalProperties: false
      required: [commandId, kind, locator, contentDigest, mediaType, sizeBytes]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/SourceKind" }
        locator:
          description: A document names its upload, "upload:<uploadId>" of beginSourceUpload (P2.6).
          type: string
          minLength: 1
          maxLength: 2048
        contentDigest: { $ref: "#/components/schemas/Digest" }
        mediaType:
          type: string
          minLength: 1
          maxLength: 128
        sizeBytes: { $ref: "#/components/schemas/Sequence" }
        access:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/AccessEntry" }
    ReplaceSourceAccessRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedAclRevision, access]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        expectedAclRevision: { $ref: "#/components/schemas/Revision" }
        access:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/AccessEntry" }
    DeleteSourceRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedRevision]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        expectedRevision: { $ref: "#/components/schemas/Revision" }
    Source:
      type: object
      additionalProperties: false
      required: [sourceId, tenantId, kind, locator, currentRevision, contentDigest, aclRevision, access, ingest, deleted, createdAt, updatedAt]
      properties:
        sourceId: { $ref: "#/components/schemas/Id" }
        tenantId: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/SourceKind" }
        locator:
          type: string
          maxLength: 2048
        currentRevision: { $ref: "#/components/schemas/Revision" }
        contentDigest: { $ref: "#/components/schemas/Digest" }
        aclRevision: { $ref: "#/components/schemas/Revision" }
        access:
          type: array
          items: { $ref: "#/components/schemas/AccessEntry" }
        ingest: { $ref: "#/components/schemas/IngestState" }
        ingestRequestId: { $ref: "#/components/schemas/Id" }
        deleted:
          type: boolean
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    SearchRequest:
      type: object
      additionalProperties: false
      required: [snapshotId, query, retrievalProfileId]
      properties:
        snapshotId: { $ref: "#/components/schemas/Id" }
        query:
          type: string
          minLength: 1
          maxLength: 8192
        maxContextItems:
          type: integer
          minimum: 1
          maximum: 64
        retrievalProfileId: { $ref: "#/components/schemas/Id" }
    Citation:
      type: object
      additionalProperties: false
      required: [ordinal, sourceId, sourceRevision, chunkId, locator, contentDigest]
      properties:
        ordinal: { $ref: "#/components/schemas/Sequence" }
        sourceId: { $ref: "#/components/schemas/Id" }
        sourceRevision: { $ref: "#/components/schemas/Revision" }
        chunkId: { $ref: "#/components/schemas/Id" }
        locator:
          type: string
          maxLength: 512
        contentDigest: { $ref: "#/components/schemas/Digest" }
    ContextItem:
      type: object
      additionalProperties: false
      required: [citation, text]
      properties:
        citation: { $ref: "#/components/schemas/Citation" }
        text:
          type: string
          maxLength: 65536
    SearchResponse:
      type: object
      additionalProperties: false
      required: [items, noAnswer, indexGeneration]
      properties:
        items:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/ContextItem" }
        noAnswer:
          type: boolean
        indexGeneration: { $ref: "#/components/schemas/Sequence" }

    # ---- memories ----
    FactState:
      type: string
      enum: [proposed, confirmed, rejected, revoked, expired]
    ProposeMemoryRequest:
      type: object
      additionalProperties: false
      required: [commandId, subjectType, subjectId, content]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        subjectType:
          type: string
          minLength: 1
          maxLength: 64
        subjectId: { $ref: "#/components/schemas/Id" }
        content:
          type: string
          minLength: 1
          maxLength: 4096
        sourceRefs:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/SourceRef" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    MemoryDecisionRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedRevision, decision]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        expectedRevision: { $ref: "#/components/schemas/Revision" }
        decision:
          type: string
          enum: [confirm, reject, revoke]
        reasonCode:
          type: string
          maxLength: 64
    MemoryFact:
      type: object
      additionalProperties: false
      required: [factId, tenantId, subjectType, subjectId, content, contentDigest, state, revision, proposer, createdAt, updatedAt]
      properties:
        factId: { $ref: "#/components/schemas/Id" }
        tenantId: { $ref: "#/components/schemas/Id" }
        subjectType:
          type: string
          maxLength: 64
        subjectId: { $ref: "#/components/schemas/Id" }
        content:
          type: string
          maxLength: 4096
        contentDigest: { $ref: "#/components/schemas/Digest" }
        state: { $ref: "#/components/schemas/FactState" }
        revision: { $ref: "#/components/schemas/Revision" }
        proposer: { $ref: "#/components/schemas/Id" }
        confirmer: { $ref: "#/components/schemas/Id" }
        sourceRefs:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    # P2.6: recall of the caller's confirmed facts (RecallFacts), after
    # Control's commercial authorization of the disclosure.
    RecallMemoriesRequest:
      type: object
      additionalProperties: false
      required: [query, retrievalProfileId]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 8192
        maxFacts:
          type: integer
          minimum: 1
          maximum: 32
        retrievalProfileId: { $ref: "#/components/schemas/Id" }
    RecallMemoriesResponse:
      type: object
      additionalProperties: false
      required: [facts, noAnswer, indexGeneration]
      properties:
        facts:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/MemoryFact" }
        noAnswer:
          type: boolean
        indexGeneration: { $ref: "#/components/schemas/Sequence" }

    # ---- mcp ----
    CatalogState:
      type: string
      enum: [discovered, review_pending, approved, rejected, disabled]
    ToolSchema:
      type: object
      additionalProperties: false
      required: [method, inputSchemaDigest, outputSchemaDigest, sideEffecting]
      properties:
        method:
          type: string
          minLength: 1
          maxLength: 256
        inputSchemaDigest: { $ref: "#/components/schemas/Digest" }
        outputSchemaDigest: { $ref: "#/components/schemas/Digest" }
        sideEffecting:
          type: boolean
        unitPrice: { $ref: "#/components/schemas/Money" }
    Descriptor:
      type: object
      additionalProperties: false
      required: [serverId, revision, canonicalResource, transport, protocolVersion, descriptorDigest, tools, state, createdAt, updatedAt]
      properties:
        serverId: { $ref: "#/components/schemas/Id" }
        revision: { $ref: "#/components/schemas/Revision" }
        canonicalResource:
          type: string
          maxLength: 2048
        transport:
          type: string
          enum: [streamable-http, stdio]
        protocolVersion:
          type: string
          maxLength: 32
        descriptorDigest: { $ref: "#/components/schemas/Digest" }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolSchema" }
        state: { $ref: "#/components/schemas/CatalogState" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    CatalogPage:
      type: object
      additionalProperties: false
      required: [descriptors]
      properties:
        descriptors:
          type: array
          items: { $ref: "#/components/schemas/Descriptor" }
        nextCursor:
          type: string
          maxLength: 512
    ReviewDescriptorRequest:
      type: object
      additionalProperties: false
      required: [commandId, revision, descriptorDigest, decision]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        revision: { $ref: "#/components/schemas/Revision" }
        descriptorDigest: { $ref: "#/components/schemas/Digest" }
        decision:
          type: string
          enum: [approve, reject, disable]
        reasonCode:
          type: string
          maxLength: 64
    GrantState:
      type: string
      enum: [pending, active, revoking, revoked, expired, registration_failed]
    CreateGrantRequest:
      type: object
      additionalProperties: false
      required: [commandId, subjectType, subjectId, serverId, descriptorRevision, descriptorDigest, methods, purpose, costCap]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        subjectType:
          type: string
          enum: [tenant, project, actor, role]
        subjectId: { $ref: "#/components/schemas/Id" }
        serverId: { $ref: "#/components/schemas/Id" }
        descriptorRevision: { $ref: "#/components/schemas/Revision" }
        descriptorDigest: { $ref: "#/components/schemas/Digest" }
        methods:
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: string
            minLength: 1
            maxLength: 256
        purpose:
          type: string
          minLength: 1
          maxLength: 256
        costCap: { $ref: "#/components/schemas/Money" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    RevokeGrantRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedRevision]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        expectedRevision: { $ref: "#/components/schemas/Revision" }
        reasonCode:
          type: string
          maxLength: 64
    Grant:
      type: object
      additionalProperties: false
      required: [grantId, revision, tenantId, subjectType, subjectId, serverId, descriptorRevision, descriptorDigest, methods, purpose, costCap, state, newAdmissionBlocked, sendersConverged, createdAt, updatedAt]
      properties:
        grantId: { $ref: "#/components/schemas/Id" }
        revision: { $ref: "#/components/schemas/Revision" }
        tenantId: { $ref: "#/components/schemas/Id" }
        subjectType:
          type: string
          enum: [tenant, project, actor, role]
        subjectId: { $ref: "#/components/schemas/Id" }
        serverId: { $ref: "#/components/schemas/Id" }
        descriptorRevision: { $ref: "#/components/schemas/Revision" }
        descriptorDigest: { $ref: "#/components/schemas/Digest" }
        methods:
          type: array
          items:
            type: string
        purpose:
          type: string
          maxLength: 256
        costCap: { $ref: "#/components/schemas/Money" }
        state: { $ref: "#/components/schemas/GrantState" }
        newAdmissionBlocked:
          type: boolean
        sendersConverged:
          type: boolean
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    CallState:
      type: string
      enum: [accepted, admitted, sent, succeeded, failed, denied, unknown, canceled]
    CreateToolCallRequest:
      type: object
      additionalProperties: false
      required: [commandId, grantId, grantRevision, method, arguments, operationId, attemptId, executionEpoch]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        grantId: { $ref: "#/components/schemas/Id" }
        grantRevision: { $ref: "#/components/schemas/Revision" }
        method:
          type: string
          minLength: 1
          maxLength: 256
        arguments:
          description: The argument object (at most 64 KiB serialized); MCP digests its exact bytes and validates it against the grant revision's input schema.
          type: object
        operationId: { $ref: "#/components/schemas/Id" }
        attemptId: { $ref: "#/components/schemas/Id" }
        executionEpoch: { $ref: "#/components/schemas/Sequence" }
    ToolCall:
      type: object
      additionalProperties: false
      required: [callId, tenantId, grantId, grantRevision, serverId, method, argumentDigest, state, createdAt, updatedAt]
      properties:
        callId: { $ref: "#/components/schemas/Id" }
        tenantId: { $ref: "#/components/schemas/Id" }
        grantId: { $ref: "#/components/schemas/Id" }
        grantRevision: { $ref: "#/components/schemas/Revision" }
        serverId: { $ref: "#/components/schemas/Id" }
        method:
          type: string
          maxLength: 256
        argumentDigest: { $ref: "#/components/schemas/Digest" }
        state: { $ref: "#/components/schemas/CallState" }
        resultDigest: { $ref: "#/components/schemas/Digest" }
        result:
          description: The bounded normalized typed result; untrusted data, never instructions.
          type: object
        failureCode:
          type: string
          maxLength: 64
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    SourcePage:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/Source" }
        nextCursor:
          type: string
          maxLength: 512
    MemoryPage:
      type: object
      additionalProperties: false
      required: [facts]
      properties:
        facts:
          type: array
          items: { $ref: "#/components/schemas/MemoryFact" }
        nextCursor:
          type: string
          maxLength: 512
    GrantPage:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
        nextCursor:
          type: string
          maxLength: 512
    RevocationProgress:
      type: object
      additionalProperties: false
      required: [grant, newAdmissionBlocked, sendersConverged, inFlightCalls, unknownCalls, openCalls, controlState]
      properties:
        grant: { $ref: "#/components/schemas/Grant" }
        newAdmissionBlocked:
          description: New admission is blocked (at the revocation's commit).
          type: boolean
        sendersConverged:
          description: Every earlier sender is settled; distinct from blocked admission.
          type: boolean
        inFlightCalls: { $ref: "#/components/schemas/Sequence" }
        unknownCalls: { $ref: "#/components/schemas/Sequence" }
        openCalls: { $ref: "#/components/schemas/Sequence" }
        controlState:
          type: string
          enum: [none, fenced, converging, converged]
    ToolDeclaration:
      type: object
      additionalProperties: false
      required: [method, sideEffecting, unitPrice]
      properties:
        method:
          type: string
          minLength: 1
          maxLength: 256
        sideEffecting:
          type: boolean
        unitPrice: { $ref: "#/components/schemas/Money" }
        idempotent:
          type: boolean
        querySupported:
          type: boolean
    DiscoverServerRequest:
      type: object
      additionalProperties: false
      required: [commandId, canonicalResource, transport, protocolVersion, provenance, dataClass, tools]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        canonicalResource:
          type: string
          minLength: 1
          maxLength: 2048
        transport:
          type: string
          enum: [streamable-http]
        protocolVersion:
          type: string
          minLength: 1
          maxLength: 32
        provenance:
          type: string
          minLength: 1
          maxLength: 512
        dataClass:
          type: string
          enum: [public, internal, confidential, restricted]
        tools:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/ToolDeclaration" }
        networkScope:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 253
        licenses:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 128
        descriptorDigest: { $ref: "#/components/schemas/Digest" }
    PreviewState:
      type: string
      enum: [saving, conflict, building, ready, stale, failed]
    PreviewArtifact:
      type: object
      additionalProperties: false
      required: [digest, sizeBytes, mediaType]
      properties:
        digest: { $ref: "#/components/schemas/Digest" }
        sizeBytes: { $ref: "#/components/schemas/Sequence" }
        mediaType:
          type: string
          enum: [text/javascript, text/css]
    Preview:
      description: A preview_build operation's committed preview. A stale preview is diagnostic only; it never replaces the current one.
      type: object
      additionalProperties: false
      required: [operationId, subjectDigest, baseRevision, state, sourceDigest, styles, buildProfileId, hostProfileId, revision, updatedAt]
      properties:
        operationId: { $ref: "#/components/schemas/Id" }
        subjectDigest: { $ref: "#/components/schemas/Digest" }
        baseRevision: { $ref: "#/components/schemas/Revision" }
        state: { $ref: "#/components/schemas/PreviewState" }
        sourceRevision: { $ref: "#/components/schemas/Revision" }
        currentRevision: { $ref: "#/components/schemas/Revision" }
        sourceDigest: { $ref: "#/components/schemas/Digest" }
        module: { $ref: "#/components/schemas/PreviewArtifact" }
        styles:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/PreviewArtifact" }
        buildProfileId:
          type: string
          maxLength: 128
        hostProfileId:
          type: string
          maxLength: 128
        failureCode:
          type: string
          maxLength: 64
        revision: { $ref: "#/components/schemas/Revision" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }

    ReleaseState:
      type: string
      enum: [certifying, awaiting_approval, publishing, published, activated, partially_published, reconciling, rejected, failed]
    ApprovalState:
      type: string
      enum: [pending, approved, rejected, invalidated]
    TargetState:
      type: string
      enum: [pending, succeeded, failed, unknown]
    ReleaseArtifactDigest:
      type: object
      additionalProperties: false
      required: [digest, sizeBytes]
      properties:
        digest: { $ref: "#/components/schemas/Digest" }
        sizeBytes: { $ref: "#/components/schemas/Sequence" }
    ReleaseSubject:
      description: The exact subject a maintainer approves (components/component.schema.json#/$defs/releaseSubject); subjectDigest is the RFC 8785 digest of the other fields. Any changed field is a new subject that inherits no approval.
      type: object
      additionalProperties: false
      required: [componentId, puckType, sourceRevision, sourceDigest, packageName, version, npm, browser, css, buildProfileId, buildProfileDigest, validatorProfileId, validatorProfileDigest, hostAbi, hostAbiDigest, destinations, certificationEvidenceDigest, subjectDigest]
      properties:
        componentId: { $ref: "#/components/schemas/Id" }
        puckType:
          type: string
          pattern: "^[A-Z][A-Za-z0-9]{0,63}$"
        sourceRevision: { $ref: "#/components/schemas/Revision" }
        sourceDigest: { $ref: "#/components/schemas/Digest" }
        packageName:
          type: string
          maxLength: 214
        version:
          type: string
          maxLength: 64
        npm: { $ref: "#/components/schemas/ReleaseArtifactDigest" }
        browser: { $ref: "#/components/schemas/ReleaseArtifactDigest" }
        css:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/ReleaseArtifactDigest" }
        buildProfileId: { $ref: "#/components/schemas/Id" }
        buildProfileDigest: { $ref: "#/components/schemas/Digest" }
        validatorProfileId: { $ref: "#/components/schemas/Id" }
        validatorProfileDigest: { $ref: "#/components/schemas/Digest" }
        hostAbi: { $ref: "#/components/schemas/Id" }
        hostAbiDigest: { $ref: "#/components/schemas/Digest" }
        destinations:
          type: object
          additionalProperties: false
          required: [npmRegistry, browserOrigin]
          properties:
            npmRegistry:
              type: string
              maxLength: 512
            browserOrigin:
              type: string
              maxLength: 512
        certificationEvidenceDigest: { $ref: "#/components/schemas/Digest" }
        subjectDigest: { $ref: "#/components/schemas/Digest" }
    Approval:
      type: object
      additionalProperties: false
      required: [state, subjectDigest]
      properties:
        state: { $ref: "#/components/schemas/ApprovalState" }
        subjectDigest: { $ref: "#/components/schemas/Digest" }
        approverId: { $ref: "#/components/schemas/Id" }
        decidedAt: { $ref: "#/components/schemas/Timestamp" }
        reasonCode:
          type: string
          maxLength: 64
    ReleaseTarget:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/TargetState" }
        receiptId: { $ref: "#/components/schemas/Id" }
        receiptDigest: { $ref: "#/components/schemas/Digest" }
        destination:
          type: string
          maxLength: 512
        manifestDigest: { $ref: "#/components/schemas/Digest" }
        failureCode:
          type: string
          maxLength: 64
    ReleaseLock:
      description: The exact lock entry a saved page pins for an activated release (components/component.schema.json#/$defs/remoteComponentLock).
      type: object
      additionalProperties: false
      required: [schemaVersion, componentId, puckType, releaseId, packageName, packageVersion, browserManifestDigest, hostProfileId]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        componentId: { $ref: "#/components/schemas/Id" }
        puckType:
          type: string
          pattern: "^[A-Z][A-Za-z0-9]{0,63}$"
        releaseId: { $ref: "#/components/schemas/Id" }
        packageName:
          type: string
          maxLength: 214
        packageVersion:
          type: string
          maxLength: 64
        browserManifestDigest: { $ref: "#/components/schemas/Digest" }
        hostProfileId: { $ref: "#/components/schemas/Id" }
    Release:
      description: A release operation's committed projection. Only an activated release names its lock; npm success alone, an unknown target or a pending approval is never a delivered release.
      type: object
      additionalProperties: false
      required: [operationId, lineage, sourceRevision, state, npm, browser, activation, revision, updatedAt]
      properties:
        operationId: { $ref: "#/components/schemas/Id" }
        lineage: { $ref: "#/components/schemas/Digest" }
        sourceRevision: { $ref: "#/components/schemas/Revision" }
        state: { $ref: "#/components/schemas/ReleaseState" }
        subject: { $ref: "#/components/schemas/ReleaseSubject" }
        releaseId: { $ref: "#/components/schemas/Id" }
        approval: { $ref: "#/components/schemas/Approval" }
        approvalDeadline: { $ref: "#/components/schemas/Timestamp" }
        npm: { $ref: "#/components/schemas/ReleaseTarget" }
        browser: { $ref: "#/components/schemas/ReleaseTarget" }
        activation: { $ref: "#/components/schemas/ReleaseTarget" }
        catalogRevision: { $ref: "#/components/schemas/Revision" }
        lock: { $ref: "#/components/schemas/ReleaseLock" }
        failureCode:
          type: string
          maxLength: 64
        revision: { $ref: "#/components/schemas/Revision" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }

    # ---- artifacts ----
    ArtifactClass:
      type: string
      enum: [prompt, brief, source, stage, result, evidence, answer, argument, npm, browser, css]
    TransferState:
      type: string
      enum: [begun, finalized, rejected, expired]
    BeginTransferRequest:
      type: object
      additionalProperties: false
      required: [commandId, class, expectedDigest, expectedSize, mediaType]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        class: { $ref: "#/components/schemas/ArtifactClass" }
        expectedDigest: { $ref: "#/components/schemas/Digest" }
        expectedSize: { $ref: "#/components/schemas/Sequence" }
        mediaType:
          type: string
          minLength: 1
          maxLength: 128
        operationId: { $ref: "#/components/schemas/Id" }
        attemptId: { $ref: "#/components/schemas/Id" }
    FinalizeTransferRequest:
      type: object
      additionalProperties: false
      required: [commandId, objectVersion]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        objectVersion:
          type: string
          minLength: 1
          maxLength: 256
    Transfer:
      type: object
      additionalProperties: false
      required: [transferId, handle, class, expectedDigest, expectedSize, state, deadline]
      properties:
        transferId: { $ref: "#/components/schemas/Id" }
        handle: { $ref: "#/components/schemas/Handle" }
        class: { $ref: "#/components/schemas/ArtifactClass" }
        expectedDigest: { $ref: "#/components/schemas/Digest" }
        expectedSize: { $ref: "#/components/schemas/Sequence" }
        state: { $ref: "#/components/schemas/TransferState" }
        deadline: { $ref: "#/components/schemas/Timestamp" }
        objectVersion:
          type: string
          maxLength: 256
        uploadCapability:
          description: |
            Present only for trusted callers; never returned to a candidate. The URL of one
            upload request (uploadMethod, uploadHeaders) for exactly the declared bytes; it
            expires with uploadExpiresAt and never outlives the transfer deadline.
          type: string
          maxLength: 4096
        uploadMethod:
          type: string
          enum: [PUT]
        uploadHeaders:
          description: Headers the upload request must carry exactly (they are signed).
          type: object
          additionalProperties:
            type: string
            maxLength: 512
          maxProperties: 16
        uploadExpiresAt: { $ref: "#/components/schemas/Timestamp" }
        reasonCode:
          description: Why a transfer was rejected or expired.
          type: string
          maxLength: 64

    # ---- recovery (API-17) ----
    ObligationClass:
      type: string
      enum: [intake, job-launch, model-dispatch, tool-dispatch, business-write]
    RecoveryPhase:
      type: string
      enum: [fenced, enumerating, reconciling, restricted, reopened]
    FindingStatus:
      type: string
      enum: [present, missing, restored, resolved, unresolved, disposed, outside_scope]
    DispositionDecision:
      type: string
      enum: [confirm_not_sent, resolve_succeeded, resolve_failed, retain_exposure]
    BeginRecoveryRequest:
      type: object
      additionalProperties: false
      required: [commandId, windowStart, windowEnd]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        allTenants:
          description: Recover every tenant (needs platform_operator); otherwise the principal's tenant.
          type: boolean
        windowStart: { $ref: "#/components/schemas/Timestamp" }
        windowEnd: { $ref: "#/components/schemas/Timestamp" }
        clockUncertaintySeconds:
          description: Clock uncertainty Control widens the window by.
          type: integer
          minimum: 0
          maximum: 86400
        reason:
          type: string
          maxLength: 512
    ClassProgress:
      type: object
      additionalProperties: false
      required: [class, complete, seen]
      properties:
        class: { $ref: "#/components/schemas/ObligationClass" }
        complete:
          type: boolean
        seen: { $ref: "#/components/schemas/Sequence" }
    RecoveryRun:
      type: object
      additionalProperties: false
      required: [runId, scopeKey, recoveryEpoch, phase, windowStart, windowEnd, clockUncertaintySeconds, fencedOperations, unsettledFindings, progress, createdAt]
      properties:
        runId: { $ref: "#/components/schemas/Id" }
        scopeKey:
          description: The recovered tenant, or "*" for every tenant.
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^(\\*|[A-Za-z0-9][A-Za-z0-9._:-]*)$"
        recoveryEpoch: { $ref: "#/components/schemas/Sequence" }
        phase: { $ref: "#/components/schemas/RecoveryPhase" }
        windowStart: { $ref: "#/components/schemas/Timestamp" }
        windowEnd: { $ref: "#/components/schemas/Timestamp" }
        clockUncertaintySeconds:
          type: integer
          minimum: 0
        fencedOperations: { $ref: "#/components/schemas/Sequence" }
        unsettledFindings: { $ref: "#/components/schemas/Sequence" }
        progress:
          type: array
          items: { $ref: "#/components/schemas/ClassProgress" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        reopenedAt: { $ref: "#/components/schemas/Timestamp" }
    Finding:
      type: object
      additionalProperties: false
      required: [findingId, runId, class, obligationId, tenantId, inventoryVersion, recordedAt, status]
      properties:
        findingId: { $ref: "#/components/schemas/Id" }
        runId: { $ref: "#/components/schemas/Id" }
        class: { $ref: "#/components/schemas/ObligationClass" }
        obligationId: { $ref: "#/components/schemas/Id" }
        tenantId: { $ref: "#/components/schemas/Id" }
        inventoryVersion:
          type: string
          maxLength: 256
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        status: { $ref: "#/components/schemas/FindingStatus" }
        outcome:
          type: string
          maxLength: 64
        evidenceRef:
          type: string
          maxLength: 256
        detail:
          type: string
          maxLength: 512
        launchKey:
          description: The launch identity the trusted launcher observes, for a job-launch finding the database holds.
          type: string
          maxLength: 256
    FindingPage:
      type: object
      additionalProperties: false
      required: [findings, complete]
      properties:
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        nextCursor:
          type: string
          maxLength: 512
        complete:
          type: boolean
    DisposeObligationRequest:
      type: object
      additionalProperties: false
      required: [commandId, class, obligationId, decision, evidenceRef, evidenceDigest, recoveryEpoch]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        class: { $ref: "#/components/schemas/ObligationClass" }
        obligationId: { $ref: "#/components/schemas/Id" }
        decision: { $ref: "#/components/schemas/DispositionDecision" }
        evidenceRef:
          type: string
          minLength: 1
          maxLength: 256
        evidenceDigest: { $ref: "#/components/schemas/Digest" }
        recoveryEpoch:
          type: string
          pattern: "^[1-9][0-9]{0,19}$"
        reason:
          type: string
          maxLength: 512
    Disposition:
      type: object
      additionalProperties: false
      required: [dispositionId, runId, class, obligationId, decision, evidenceRef, evidenceDigest, recoveryEpoch, decidedAt]
      properties:
        dispositionId: { $ref: "#/components/schemas/Id" }
        runId: { $ref: "#/components/schemas/Id" }
        class: { $ref: "#/components/schemas/ObligationClass" }
        obligationId: { $ref: "#/components/schemas/Id" }
        decision: { $ref: "#/components/schemas/DispositionDecision" }
        evidenceRef:
          type: string
          maxLength: 256
        evidenceDigest: { $ref: "#/components/schemas/Digest" }
        recoveryEpoch: { $ref: "#/components/schemas/Sequence" }
        decidedAt: { $ref: "#/components/schemas/Timestamp" }
    BudgetLevel:
      type: string
      enum: [platform, tenant, actor]
    CreditLevel:
      type: string
      enum: [tenant, actor]
    Credits:
      description: A whole number of credits.
      type: integer
      minimum: 0
      maximum: 1000000000
    BudgetPool:
      description: >-
        A USD funding limit of one level for one period. Allocations to
        operations draw from it; settlement returns the unspent part.
      type: object
      additionalProperties: false
      required: [poolId, level, periodStart, periodEnd, cap, allocated, available, revision]
      properties:
        poolId: { $ref: "#/components/schemas/Id" }
        level: { $ref: "#/components/schemas/BudgetLevel" }
        tenantId: { $ref: "#/components/schemas/Id" }
        actorId: { $ref: "#/components/schemas/Id" }
        periodStart: { $ref: "#/components/schemas/Timestamp" }
        periodEnd: { $ref: "#/components/schemas/Timestamp" }
        cap: { $ref: "#/components/schemas/Money" }
        allocated: { $ref: "#/components/schemas/Money" }
        available: { $ref: "#/components/schemas/Money" }
        revision: { $ref: "#/components/schemas/Revision" }
    CreateBudgetPoolRequest:
      description: >-
        tenantId is required for a tenant or actor pool and absent for a
        platform pool; actorId is present for an actor pool only.
      type: object
      additionalProperties: false
      required: [commandId, level, periodStart, periodEnd, cap]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        level: { $ref: "#/components/schemas/BudgetLevel" }
        tenantId: { $ref: "#/components/schemas/Id" }
        actorId: { $ref: "#/components/schemas/Id" }
        periodStart: { $ref: "#/components/schemas/Timestamp" }
        periodEnd: { $ref: "#/components/schemas/Timestamp" }
        cap: { $ref: "#/components/schemas/Money" }
    AdjustBudgetPoolRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedRevision, cap]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        expectedRevision: { $ref: "#/components/schemas/Revision" }
        cap: { $ref: "#/components/schemas/Money" }
    CreditPool:
      description: >-
        A limit on how many operations of one tenant or actor are funded in one
        period (DEC-066). Debited credits are never refunded.
      type: object
      additionalProperties: false
      required: [creditPoolId, level, tenantId, periodStart, periodEnd, limit, used, available, revision]
      properties:
        creditPoolId: { $ref: "#/components/schemas/Id" }
        level: { $ref: "#/components/schemas/CreditLevel" }
        tenantId: { $ref: "#/components/schemas/Id" }
        actorId: { $ref: "#/components/schemas/Id" }
        periodStart: { $ref: "#/components/schemas/Timestamp" }
        periodEnd: { $ref: "#/components/schemas/Timestamp" }
        limit: { $ref: "#/components/schemas/Credits" }
        used: { $ref: "#/components/schemas/Credits" }
        available: { $ref: "#/components/schemas/Credits" }
        revision: { $ref: "#/components/schemas/Revision" }
    CreateCreditPoolRequest:
      description: actorId is required for an actor pool and absent for a tenant pool.
      type: object
      additionalProperties: false
      required: [commandId, level, tenantId, periodStart, periodEnd, limit]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        level: { $ref: "#/components/schemas/CreditLevel" }
        tenantId: { $ref: "#/components/schemas/Id" }
        actorId: { $ref: "#/components/schemas/Id" }
        periodStart: { $ref: "#/components/schemas/Timestamp" }
        periodEnd: { $ref: "#/components/schemas/Timestamp" }
        limit: { $ref: "#/components/schemas/Credits" }
    AdjustCreditPoolRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedRevision, limit]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        expectedRevision: { $ref: "#/components/schemas/Revision" }
        limit: { $ref: "#/components/schemas/Credits" }
    # ---- conversations (DEC-067, design 0001) ----
    ConversationStatus:
      type: string
      enum: [active, archived]
    ConversationTitle:
      type: string
      minLength: 1
      maxLength: 200
    Conversation:
      description: >-
        A personal conversation. `revision` moves on a rename, an archive, a restore and
        each accepted message; `lastMessageSeq` is "0" before the first message. D4: on GET
        /conversations/{conversationId} only, `coveredEventSeq` is the last event the read covers
        ("0" before the first event; subscribe to the event stream after it, design 0001 §8.4) and
        `activeTurn` the open turn, read in the same transaction.
      type: object
      additionalProperties: false
      required: [conversationId, tenantId, ownerActorId, status, revision, lastMessageSeq, createdAt, updatedAt]
      properties:
        conversationId: { $ref: "#/components/schemas/Id" }
        tenantId: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        ownerActorId: { $ref: "#/components/schemas/Id" }
        status: { $ref: "#/components/schemas/ConversationStatus" }
        title: { $ref: "#/components/schemas/ConversationTitle" }
        revision: { $ref: "#/components/schemas/Revision" }
        lastMessageSeq: { $ref: "#/components/schemas/Sequence" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        coveredEventSeq: { $ref: "#/components/schemas/Sequence" }
        activeTurn: { $ref: "#/components/schemas/Turn" }
    ConversationPage:
      type: object
      additionalProperties: false
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        nextCursor:
          type: string
          maxLength: 512
    CreateConversationRequest:
      type: object
      additionalProperties: false
      required: [commandId]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        title: { $ref: "#/components/schemas/ConversationTitle" }
    UpdateConversationRequest:
      description: At least one of title and status is present.
      type: object
      additionalProperties: false
      required: [commandId, expectedRevision]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        expectedRevision: { $ref: "#/components/schemas/Revision" }
        title: { $ref: "#/components/schemas/ConversationTitle" }
        status: { $ref: "#/components/schemas/ConversationStatus" }
    MessageRole:
      type: string
      enum: [user, assistant]
    MessageState:
      description: >-
        `completed` is the only state a stored user message has. The other states belong to
        assistant replies (design 0001 §6.4); none of them means a complete reply.
      type: string
      enum: [pending, streaming, completed, partial_failed, canceled, reconciling]
    MessageContent:
      description: Text only. `text` is at most 32768 bytes of UTF-8, which the server checks.
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
          minLength: 1
          maxLength: 32768
    Message:
      description: >-
        D4: `contentRevision` is the version of the text, from 1, and moves with each committed
        chunk of a `streaming` assistant message; `throughChunkSeq` is the last committed chunk the
        text covers ("0" for a user message and for a reply stored whole).
      type: object
      additionalProperties: false
      required: [messageId, conversationId, messageSeq, role, state, content, contentDigest, createdAt]
      properties:
        messageId: { $ref: "#/components/schemas/Id" }
        conversationId: { $ref: "#/components/schemas/Id" }
        messageSeq: { $ref: "#/components/schemas/Sequence" }
        role: { $ref: "#/components/schemas/MessageRole" }
        state: { $ref: "#/components/schemas/MessageState" }
        content: { $ref: "#/components/schemas/MessageContent" }
        contentDigest: { $ref: "#/components/schemas/Digest" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        contentRevision: { $ref: "#/components/schemas/Sequence" }
        throughChunkSeq: { $ref: "#/components/schemas/Sequence" }
    MessagePage:
      description: >-
        Messages in ascending messageSeq. `nextBeforeMessageSeq` is present when older
        messages exist; pass it as `beforeMessageSeq` for the page before this one.
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        nextBeforeMessageSeq: { $ref: "#/components/schemas/Sequence" }
    AppendMessageRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedRevision, content]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
        expectedRevision: { $ref: "#/components/schemas/Revision" }
        content: { $ref: "#/components/schemas/MessageContent" }
    MessageReceipt:
      description: >-
        The stored user message. `turnId` and `operationId` name the reply's turn where
        assistant replies are enabled (DEC-068), and are absent where they are not. The turn
        view names the assistant message once its text is stored; `assistantMessageId` is
        reserved here for a later phase.
      type: object
      additionalProperties: false
      required: [conversationId, messageId, messageSeq, conversationRevision, createdAt]
      properties:
        conversationId: { $ref: "#/components/schemas/Id" }
        messageId: { $ref: "#/components/schemas/Id" }
        messageSeq: { $ref: "#/components/schemas/Sequence" }
        conversationRevision: { $ref: "#/components/schemas/Revision" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        turnId: { $ref: "#/components/schemas/Id" }
        assistantMessageId: { $ref: "#/components/schemas/Id" }
        operationId: { $ref: "#/components/schemas/Id" }
    TurnState:
      description: >-
        Design 0001 §4.2. Only `completed` means a complete reply; `failed` and `canceled` keep
        any stored text, marked partial; `cancel_pending` and `reconciling` keep the
        conversation's one reply slot until the sender is proven stopped.
      type: string
      enum: [queued, running, completed, failed, cancel_pending, canceled, reconciling]
    ContentStatus:
      description: "`complete`: the whole reply stored; `partial`: a prefix at most; `unknown`: not yet known or not provable."
      type: string
      enum: [complete, partial, unknown]
    SenderStatus:
      description: >-
        Whether the reply's controlled sending path can still send or append (design 0001 §7.4);
        `stopped` never says the provider stopped billing.
      type: string
      enum: [not_started, active, stopped, unknown]
    Turn:
      description: >-
        One bounded assistant reply to one user message (design 0001 §4.1). `assistantMessageId`
        is present once the reply's text is stored (since D4, once its first chunk is committed);
        a turn that ended before any text has none.
        `finance` is the turn operation's finance state, never derived from the text.
        `operationId` names that chat_turn operation for the ledger; chat_turn is not a public
        operation kind in this phase, so /operations does not serve it.
      type: object
      additionalProperties: false
      required: [turnId, conversationId, inputMessageId, operationId, state, contentStatus, senderStatus, finance, createdAt, updatedAt]
      properties:
        turnId: { $ref: "#/components/schemas/Id" }
        conversationId: { $ref: "#/components/schemas/Id" }
        inputMessageId: { $ref: "#/components/schemas/Id" }
        assistantMessageId: { $ref: "#/components/schemas/Id" }
        operationId: { $ref: "#/components/schemas/Id" }
        state: { $ref: "#/components/schemas/TurnState" }
        contentStatus: { $ref: "#/components/schemas/ContentStatus" }
        senderStatus: { $ref: "#/components/schemas/SenderStatus" }
        finance: { $ref: "#/components/schemas/FinanceState" }
        failureCode:
          description: A stable code for failed, canceled and reconciling turns, for example UPSTREAM_FINISH_LENGTH or SENDER_LOST.
          type: string
          minLength: 1
          maxLength: 64
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    ConversationEventFrame:
      description: >-
        The `data` of one SSE conversation event (design 0001 §8.1). The common fields are always
        present; each type adds its own: `message.accepted` messageId, messageSeq, role, turnId;
        `message.started` messageId, turnId; `message.delta` messageId, chunkSeq, contentRevision,
        text; `message.completed`, `message.failed` and `message.canceled` messageId, state,
        contentRevision, throughChunkSeq, contentDigest, turnState, failureCode; `turn.changed`
        turn; `conversation.changed` conversationRevision, status. No frame carries a prompt,
        provider reasoning or tool arguments.
      type: object
      additionalProperties: false
      required: [conversationId, eventSeq, eventType, occurredAt]
      properties:
        conversationId: { $ref: "#/components/schemas/Id" }
        eventSeq: { $ref: "#/components/schemas/Sequence" }
        eventType:
          type: string
          enum: [message.accepted, message.started, message.delta, message.completed, message.failed, message.canceled, turn.changed, conversation.changed]
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
        messageId: { $ref: "#/components/schemas/Id" }
        messageSeq: { $ref: "#/components/schemas/Sequence" }
        role: { $ref: "#/components/schemas/MessageRole" }
        turnId: { $ref: "#/components/schemas/Id" }
        chunkSeq: { $ref: "#/components/schemas/Sequence" }
        contentRevision: { $ref: "#/components/schemas/Sequence" }
        text:
          description: One committed chunk's text, whole UTF-8 characters, at most 32768 bytes.
          type: string
          minLength: 1
          maxLength: 32768
        state: { $ref: "#/components/schemas/MessageState" }
        throughChunkSeq: { $ref: "#/components/schemas/Sequence" }
        contentDigest: { $ref: "#/components/schemas/Digest" }
        turnState: { $ref: "#/components/schemas/TurnState" }
        failureCode:
          type: string
          minLength: 1
          maxLength: 64
        turn: { $ref: "#/components/schemas/Turn" }
        conversationRevision: { $ref: "#/components/schemas/Revision" }
        status: { $ref: "#/components/schemas/ConversationStatus" }
    ConversationResetFrame:
      description: The `data` of an SSE `reset_required` event on a conversation stream.
      type: object
      additionalProperties: false
      required: [conversationId, coveredEventSeq]
      properties:
        conversationId: { $ref: "#/components/schemas/Id" }
        coveredEventSeq: { $ref: "#/components/schemas/Sequence" }
    ConversationEndFrame:
      description: The `data` of an SSE `end` event on a conversation stream; the stream closes after it and is resumed from the last event id.
      type: object
      additionalProperties: false
      required: [conversationId, reason]
      properties:
        conversationId: { $ref: "#/components/schemas/Id" }
        reason:
          type: string
          enum: [server_shutdown]
    StopTurnRequest:
      type: object
      additionalProperties: false
      required: [commandId]
      properties:
        commandId: { $ref: "#/components/schemas/Id" }
