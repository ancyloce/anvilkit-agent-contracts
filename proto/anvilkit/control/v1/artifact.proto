// Scoped artifact transfer and acceptance (DD-02 §6). Trusted flows receive an
// object-scoped capability; candidates receive only an opaque handle. Finalize
// verifies the actual object version, bytes, size and hash outside DB locks.
//
// Every transfer is scoped: begun under a tenant (and, when bound, an
// operation and attempt with their current execution and recovery epochs),
// read and resolved only inside that scope, and finalized only while the
// scope's epochs and deadlines are current. The capability is a short-lived
// upload authorization for exactly the declared bytes under an object key
// only Control knows; the key never appears on this surface.
syntax = "proto3";

package anvilkit.control.v1;

import "anvilkit/control/v1/control.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

enum ArtifactClass {
  ARTIFACT_CLASS_UNSPECIFIED = 0;
  ARTIFACT_CLASS_PROMPT = 1;
  ARTIFACT_CLASS_BRIEF = 2;
  ARTIFACT_CLASS_SOURCE = 3;
  ARTIFACT_CLASS_STAGE = 4;
  ARTIFACT_CLASS_RESULT = 5;
  ARTIFACT_CLASS_EVIDENCE = 6;
  ARTIFACT_CLASS_ANSWER = 7;
  ARTIFACT_CLASS_ARGUMENT = 8;
  // The build deliverables of a certified component (DD-04 §2, P10): the
  // npm tarball, the browser ES module and a stylesheet, each a finalized
  // transfer an accepted validator stage binds by exact digest and size.
  ARTIFACT_CLASS_NPM = 9;
  ARTIFACT_CLASS_BROWSER = 10;
  ARTIFACT_CLASS_CSS = 11;
}

enum TransferState {
  TRANSFER_STATE_UNSPECIFIED = 0;
  TRANSFER_STATE_BEGUN = 1;
  TRANSFER_STATE_FINALIZED = 2;
  TRANSFER_STATE_REJECTED = 3;
  TRANSFER_STATE_EXPIRED = 4;
}

message Transfer {
  string transfer_id = 1;
  string handle = 2;
  ArtifactClass class = 3;
  string expected_digest = 4;
  string expected_size = 5;
  TransferState state = 6;
  google.protobuf.Timestamp deadline = 7;
  optional string object_version = 8;
  optional string reason_code = 9;
  string tenant_id = 10;
  optional string operation_id = 11;
  optional string attempt_id = 12;
  string media_type = 13;
  // The epochs the transfer was begun under; finalization requires them to
  // be current for a bound transfer.
  string execution_epoch = 14;
  string recovery_epoch = 15;
  google.protobuf.Timestamp created_at = 16;
  optional google.protobuf.Timestamp finalized_at = 17;
}

// TransferCapability is the scoped upload authorization for one transfer:
// one request of the given method to the URL, carrying exactly the listed
// headers, with the declared bytes; it expires at expires_at and never
// outlives the transfer's deadline. It names no bucket, key or credential
// beyond what the signed URL itself carries, and it is never returned to
// candidate code.
message TransferCapability {
  string url = 1;
  string method = 2;
  map<string, string> headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}

service ArtifactService {
  rpc BeginTransfer(BeginTransferRequest) returns (BeginTransferResponse);
  // Resolves an opaque handle to a scoped capability for a trusted caller only.
  rpc ResolveHandle(ResolveHandleRequest) returns (ResolveHandleResponse);
  rpc FinalizeTransfer(FinalizeTransferRequest) returns (FinalizeTransferResponse);
  rpc GetTransfer(GetTransferRequest) returns (GetTransferResponse);
  // Issues a trusted reader the scoped download capability of a finalized
  // artifact under an authorized relationship to the reading operation
  // (P13): the artifact is the operation's own prompt, an accepted answer,
  // the brief its subject binds, or an artifact bound by an accepted stage
  // of one of its attempts. A reading physical instance must be the
  // current one of an executing attempt of that operation. The capability
  // names the exact object version; the reader verifies the bytes against
  // the digest and size answered here. Candidates never see it.
  rpc ReadArtifact(ReadArtifactRequest) returns (ReadArtifactResponse);
}

message BeginTransferRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  Scope scope = 2 [(buf.validate.field).required = true];
  ArtifactClass class = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string expected_digest = 4 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
  string expected_size = 5 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})$"];
  string media_type = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  optional string operation_id = 7 [(buf.validate.field).string = {max_len: 128}];
  optional string attempt_id = 8 [(buf.validate.field).string = {max_len: 128}];
  google.protobuf.Timestamp deadline = 9 [(buf.validate.field).required = true];
}

message BeginTransferResponse {
  Transfer transfer = 1;
  bool existing = 2;
  // The upload capability for a transfer that is still begun; the caller
  // (a trusted service) decides whether its own client may receive it.
  TransferCapability upload = 3;
}

// ResolveHandle is the trusted harness's path from a candidate's opaque
// handle to the upload capability: the resolving physical instance must be
// the current instance of the transfer's attempt under the current epochs.
message ResolveHandleRequest {
  string handle = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string instance_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ResolveHandleResponse {
  Transfer transfer = 1;
  // Scoped capability for the trusted sidecar; never returned to a candidate.
  // capability is the upload URL; upload carries the same URL with the
  // method and headers the request must use.
  string capability = 2;
  google.protobuf.Timestamp expires_at = 3;
  TransferCapability upload = 4;
}

// FinalizeTransfer names the transfer (by id or by handle) and the exact
// object version the uploader wrote; Control reads that version and
// verifies its bytes against the declared size and digest before anything
// is finalized. Caller claims, ETags and upload receipts are insufficient.
message FinalizeTransferRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  string transfer_id = 2 [(buf.validate.field).string = {max_len: 128}];
  string object_version = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string instance_id = 4 [(buf.validate.field).string = {max_len: 128}];
  string handle = 5 [(buf.validate.field).string = {max_len: 256}];
}

message FinalizeTransferResponse {
  Transfer transfer = 1;
  bool existing = 2;
}

// GetTransfer reads one transfer (by id or by handle) inside the caller's
// verified scope; a transfer of another tenant is not found.
message GetTransferRequest {
  string transfer_id = 1 [(buf.validate.field).string = {max_len: 128}];
  Scope scope = 2 [(buf.validate.field).required = true];
  string handle = 3 [(buf.validate.field).string = {max_len: 256}];
}

message GetTransferResponse {
  Transfer transfer = 1;
}

message ReadArtifactRequest {
  // The artifact by handle or by transfer id (one of the two).
  string handle = 1 [(buf.validate.field).string = {max_len: 256}];
  string transfer_id = 2 [(buf.validate.field).string = {max_len: 128}];
  // The reading operation; the relationship is checked against it.
  string operation_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // The reading physical instance when the reader is a Job's trusted
  // sidecar; empty for the Workflow's own reads.
  string instance_id = 4 [(buf.validate.field).string = {max_len: 128}];
}

message ReadArtifactResponse {
  Transfer transfer = 1;
  // The scoped download capability of the exact object version (one GET,
  // the listed headers, valid until expires_at).
  TransferCapability download = 2;
}
