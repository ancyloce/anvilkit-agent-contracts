[project]
name = "anvilkit-generated-clients"
version = "0.1.0"
description = "Generated Python consumer of the AnvilKit contract baseline: pydantic v2 models of openapi/inference.yaml for the Inference provider. Regenerated by tools/generate.py of anvilkit-agent-contracts; never hand-edited."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anvilkit_generated_clients*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
