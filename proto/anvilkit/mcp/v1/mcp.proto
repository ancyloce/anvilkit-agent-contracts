// MCP owns the reviewed catalog, grants and logical tool calls (DD-08). Control
// owns final effect admission through anvilkit.control.v1.DispatchService and
// the grant policy projection/revocation barrier. Catalog visibility is never
// a grant; a grant is executable only after Control's registration receipt.
syntax = "proto3";

package anvilkit.mcp.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Shared values (same textual rules as anvilkit.control.v1)
// ---------------------------------------------------------------------------

message CommandIdentity {
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string command_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string actor_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string request_digest = 4 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
}

message Scope {
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string project_id = 2 [(buf.validate.field).string = {max_len: 128}];
  string actor_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // The user's roles as the API verified them from the identity provider
  // (P0.3). An owner trusts them only when the verified caller workload is
  // the API; from any other caller they are ignored.
  repeated string roles = 4 [(buf.validate.field).repeated = {
    max_items: 32
    unique: true
    items: {
      string: {pattern: "^[a-z][a-z0-9_-]{0,63}$"}
    }
  }];
}

message Money {
  string currency = 1 [(buf.validate.field).string.pattern = "^[A-Z]{3}$"];
  string amount = 2 [(buf.validate.field).string.pattern = "^-?(0|[1-9][0-9]{0,29})$"];
}

// ---------------------------------------------------------------------------
// Catalog and review
// ---------------------------------------------------------------------------

enum CatalogState {
  CATALOG_STATE_UNSPECIFIED = 0;
  CATALOG_STATE_DISCOVERED = 1;
  CATALOG_STATE_REVIEW_PENDING = 2;
  CATALOG_STATE_APPROVED = 3;
  CATALOG_STATE_REJECTED = 4;
  CATALOG_STATE_DISABLED = 5;
}

enum ReviewDecision {
  REVIEW_DECISION_UNSPECIFIED = 0;
  REVIEW_DECISION_APPROVE = 1;
  REVIEW_DECISION_REJECT = 2;
}

// One method of a descriptor revision. Schemas and annotations are read
// from the live server; side effects, price, idempotency and query support
// are the listing's declarations that the reviewer approves with the exact
// descriptor digest.
message ToolSchema {
  string method = 1;
  string input_schema_digest = 2;
  string output_schema_digest = 3;
  bool side_effecting = 4;
  Money unit_price = 5;
  // Repeating the same call cannot cause a second effect.
  bool idempotent = 6;
  // The server answers a query for an original call by its identity.
  bool query_supported = 7;
  string annotations_digest = 8;
}

// Descriptor is one reviewed revision of a server; a changed descriptor is a
// new revision and existing grants do not migrate automatically.
message Descriptor {
  string server_id = 1;
  string revision = 2;
  string canonical_resource = 3;
  string transport = 4;
  string protocol_version = 5;
  string provenance = 6;
  string descriptor_digest = 7;
  repeated ToolSchema tools = 8;
  CatalogState state = 9;
  optional string review_id = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  // What the live server reported at discovery (initialize / tools, resources
  // and prompts listings through the connection layer).
  string server_name = 13;
  string server_version = 14;
  string resources_digest = 15;
  string prompts_digest = 16;
  // The declared data class, network scope (hosts the server may reach) and
  // licenses the review covers.
  string data_class = 17;
  repeated string network_scope = 18;
  repeated string licenses = 19;
  // Explicit remote revision evidence: the retrieval that produced this
  // revision (hosted servers expose no binary hash; nothing here claims
  // pinned upstream bytes).
  string revision_evidence = 20;
  string discovered_by = 21;
  optional string reviewer = 22;
}

service CatalogService {
  rpc ListCatalog(ListCatalogRequest) returns (ListCatalogResponse);
  rpc GetDescriptor(GetDescriptorRequest) returns (GetDescriptorResponse);
  // Records a discovered server descriptor; discovery never launches a package
  // or grants execution.
  rpc DiscoverServer(DiscoverServerRequest) returns (DiscoverServerResponse);
  // Authorized reviewer decision bound to the exact descriptor digest.
  rpc ReviewDescriptor(ReviewDescriptorRequest) returns (ReviewDescriptorResponse);
  // Disables a revision for new grants and new calls; existing sent effects
  // are unaffected.
  rpc DisableDescriptor(DisableDescriptorRequest) returns (DisableDescriptorResponse);
}

message ListCatalogRequest {
  Scope scope = 1 [(buf.validate.field).required = true];
  CatalogState state = 2 [(buf.validate.field).enum.defined_only = true];
  string cursor = 3 [(buf.validate.field).string = {max_len: 512}];
  uint32 limit = 4 [(buf.validate.field).uint32.lte = 200];
}

message ListCatalogResponse {
  repeated Descriptor descriptors = 1;
  string next_cursor = 2;
}

message GetDescriptorRequest {
  Scope scope = 1 [(buf.validate.field).required = true];
  string server_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string revision = 3 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})?$"];
}

message GetDescriptorResponse {
  Descriptor descriptor = 1;
}

message DiscoverServerRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  Scope scope = 2 [(buf.validate.field).required = true];
  string canonical_resource = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  string transport = 4 [(buf.validate.field).string = {
    in: [
      "streamable-http",
      "stdio"
    ]
  }];
  string protocol_version = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  string provenance = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  // The descriptor digest the caller expects (for example from a registry
  // listing); empty accepts whatever the live retrieval yields. A mismatch
  // records nothing.
  string descriptor_digest = 7 [(buf.validate.field).string.pattern = "^(sha256:[0-9a-f]{64})?$"];
  // The listing's declarations per method (side effects, price, idempotency,
  // query support); every live method must be declared and every declared
  // method must exist live. Schema digests, when given, must equal the live
  // ones.
  repeated ToolSchema tools = 8 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 512
  }];
  string data_class = 9 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "public",
        "internal",
        "confidential",
        "restricted"
      ]
    }
  ];
  repeated string network_scope = 10 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {
        min_len: 1
        max_len: 253
      }
    }
  }];
  repeated string licenses = 11 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
}

message DiscoverServerResponse {
  Descriptor descriptor = 1;
  bool existing = 2;
}

message ReviewDescriptorRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  Scope scope = 2 [(buf.validate.field).required = true];
  string server_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string revision = 4 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})$"];
  string descriptor_digest = 5 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
  ReviewDecision decision = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string reason_code = 7 [(buf.validate.field).string = {max_len: 64}];
}

message ReviewDescriptorResponse {
  Descriptor descriptor = 1;
  bool existing = 2;
}

message DisableDescriptorRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  Scope scope = 2 [(buf.validate.field).required = true];
  string server_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string revision = 4 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})$"];
  optional string reason_code = 5 [(buf.validate.field).string = {max_len: 64}];
}

message DisableDescriptorResponse {
  Descriptor descriptor = 1;
  bool existing = 2;
}

// ---------------------------------------------------------------------------
// Grants and revocation
// ---------------------------------------------------------------------------

enum GrantState {
  GRANT_STATE_UNSPECIFIED = 0;
  GRANT_STATE_PENDING = 1;
  GRANT_STATE_ACTIVE = 2;
  GRANT_STATE_REVOKING = 3;
  GRANT_STATE_REVOKED = 4;
  GRANT_STATE_EXPIRED = 5;
  GRANT_STATE_REGISTRATION_FAILED = 6;
}

message Grant {
  string grant_id = 1;
  string revision = 2;
  string tenant_id = 3;
  string subject_type = 4;
  string subject_id = 5;
  string server_id = 6;
  string descriptor_revision = 7;
  string descriptor_digest = 8;
  repeated string methods = 9;
  string purpose = 10;
  Money cost_cap = 11;
  GrantState state = 12;
  optional string control_receipt_id = 13;
  optional google.protobuf.Timestamp expires_at = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  // The security dimensions the grant revision binds (DD-08 §2); the policy
  // digest registered with Control covers all of them.
  string canonical_resource = 17;
  string transport = 18;
  string protocol_version = 19;
  string issuer = 20;
  string audience = 21;
  repeated string resource_selectors = 22;
  repeated string prompt_selectors = 23;
  string data_class = 24;
  string policy_digest = 25;
  string policy_epoch = 26;
  // The last management outcome that kept the grant non-executable (a
  // failed or unanswered registration, a disabled descriptor).
  optional string failure_code = 27;
}

service GrantService {
  // Persists PENDING, registers the policy with Control and marks ACTIVE only
  // after the receipt; intermediate failure stays non-executable.
  rpc CreateGrant(CreateGrantRequest) returns (CreateGrantResponse);
  rpc GetGrant(GetGrantRequest) returns (GetGrantResponse);
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
  // Commits REVOKING and denies new admission immediately, then installs the
  // Control barrier; REVOKED is final only after in-flight calls converge.
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
  rpc GetRevocationProgress(GetRevocationProgressRequest) returns (GetRevocationProgressResponse);
}

message CreateGrantRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  Scope scope = 2 [(buf.validate.field).required = true];
  string subject_type = 3 [(buf.validate.field).string = {
    in: [
      "tenant",
      "project",
      "actor",
      "role"
    ]
  }];
  string subject_id = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string server_id = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string descriptor_revision = 6 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})$"];
  string descriptor_digest = 7 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
  repeated string methods = 8 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 256
  }];
  string purpose = 9 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  Money cost_cap = 10 [(buf.validate.field).required = true];
  optional google.protobuf.Timestamp expires_at = 11;
  // Resource and prompt selectors the grant allows (exact names of the
  // descriptor's resources and prompts); none when the grant covers tools only.
  repeated string resource_selectors = 12 [(buf.validate.field).repeated.max_items = 64];
  repeated string prompt_selectors = 13 [(buf.validate.field).repeated.max_items = 64];
  // The data class of the purpose; it may not exceed the descriptor's.
  string data_class = 14 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "public",
        "internal",
        "confidential",
        "restricted"
      ]
    }
  ];
}

message CreateGrantResponse {
  Grant grant = 1;
  bool existing = 2;
}

message GetGrantRequest {
  Scope scope = 1 [(buf.validate.field).required = true];
  string grant_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetGrantResponse {
  Grant grant = 1;
}

message ListGrantsRequest {
  Scope scope = 1 [(buf.validate.field).required = true];
  GrantState state = 2 [(buf.validate.field).enum.defined_only = true];
  string cursor = 3 [(buf.validate.field).string = {max_len: 512}];
  uint32 limit = 4 [(buf.validate.field).uint32.lte = 200];
}

message ListGrantsResponse {
  repeated Grant grants = 1;
  string next_cursor = 2;
}

message RevokeGrantRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  Scope scope = 2 [(buf.validate.field).required = true];
  string grant_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string expected_revision = 4 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})$"];
  optional string reason_code = 5 [(buf.validate.field).string = {max_len: 64}];
}

message RevokeGrantResponse {
  Grant grant = 1;
  bool existing = 2;
}

message GetRevocationProgressRequest {
  Scope scope = 1 [(buf.validate.field).required = true];
  string grant_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetRevocationProgressResponse {
  Grant grant = 1;
  // Blocked new admission is distinct from all previous senders converged.
  bool new_admission_blocked = 2;
  bool senders_converged = 3;
  string in_flight_calls = 4;
  string unknown_calls = 5;
  // Control's barrier state (fenced, converging, converged) as last read, and
  // MCP's own tool requests of the grant that are not yet terminal.
  string control_state = 6;
  string open_calls = 7;
}

// ---------------------------------------------------------------------------
// Tool calls
// ---------------------------------------------------------------------------

enum CallState {
  CALL_STATE_UNSPECIFIED = 0;
  CALL_STATE_ACCEPTED = 1;
  CALL_STATE_ADMITTED = 2;
  CALL_STATE_SENT = 3;
  CALL_STATE_SUCCEEDED = 4;
  CALL_STATE_FAILED = 5;
  CALL_STATE_DENIED = 6;
  CALL_STATE_UNKNOWN = 7;
  CALL_STATE_CANCELED = 8;
}

message ToolCall {
  string call_id = 1;
  string tenant_id = 2;
  string grant_id = 3;
  string grant_revision = 4;
  string server_id = 5;
  string method = 6;
  string argument_digest = 7;
  CallState state = 8;
  optional string control_dispatch_id = 9;
  optional string result_ref = 10;
  optional string result_digest = 11;
  optional string failure_code = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  // The bounded, normalized typed result (JSON: content blocks, structured
  // content, isError) of a SUCCEEDED or FAILED call; result_digest is its
  // SHA-256. Returned content, links and prompts are untrusted data.
  bytes result = 15;
  // The descriptor revision, digest and protocol version the call was bound
  // to at acceptance (the grant revision's).
  string descriptor_revision = 16;
  string descriptor_digest = 17;
  string protocol_version = 18;
}

service CallService {
  // Persists a tracked ToolRequest; the trusted adapter then requests a
  // single-use AdmitTool from Control. Same command/digest returns the original.
  rpc CreateCall(CreateCallRequest) returns (CreateCallResponse);
  // Querying a call never sends again.
  rpc GetCall(GetCallRequest) returns (GetCallResponse);
}

message CreateCallRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  Scope scope = 2 [(buf.validate.field).required = true];
  string grant_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string grant_revision = 4 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})$"];
  string method = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string argument_ref = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  string argument_digest = 7 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
  string operation_id = 8 [(buf.validate.field).string = {max_len: 128}];
  string attempt_id = 9 [(buf.validate.field).string = {max_len: 128}];
  google.protobuf.Timestamp deadline = 10 [(buf.validate.field).required = true];
  // The rest of the execution binding Control admits the dispatch under
  // (with operation_id and attempt_id).
  string instance_id = 11 [(buf.validate.field).string = {max_len: 128}];
  string execution_epoch = 12 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})?$"];
  // The argument bytes (a JSON object, bounded): argument_digest is their
  // SHA-256 and argument_ref the caller's reference of them. MCP verifies
  // the digest and validates them against the grant revision's input schema.
  bytes arguments = 13 [(buf.validate.field).bytes = {max_len: 65536}];
}

message CreateCallResponse {
  ToolCall call = 1;
  bool existing = 2;
}

message GetCallRequest {
  Scope scope = 1 [(buf.validate.field).required = true];
  string call_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetCallResponse {
  ToolCall call = 1;
}

// ---------------------------------------------------------------------------
// BackgroundTaskService: identical owner contract to anvilkit.knowledge.v1.
// ---------------------------------------------------------------------------

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PENDING = 1;
  TASK_STATE_LEASED = 2;
  TASK_STATE_RESULT_SUBMITTED = 3;
  TASK_STATE_ACCEPTED = 4;
  TASK_STATE_RETRY_SCHEDULED = 5;
  TASK_STATE_DEAD = 6;
  TASK_STATE_STALE = 7;
  TASK_STATE_CANCELED = 8;
}

message BackgroundTask {
  string task_id = 1;
  string generation = 2;
  string task_kind = 3;
  string input_digest = 4;
  TaskState state = 5;
  optional string worker_id = 6;
  optional google.protobuf.Timestamp lease_until = 7;
  string attempt_count = 8;
}

service BackgroundTaskService {
  rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse);
  rpc HeartbeatTask(HeartbeatTaskRequest) returns (HeartbeatTaskResponse);
  rpc SubmitTaskResult(SubmitTaskResultRequest) returns (SubmitTaskResultResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
}

message ClaimTaskRequest {
  string task_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string generation = 2 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})$"];
  string worker_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  uint32 lease_seconds = 4 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 3600
  }];
}

message ClaimTaskResponse {
  BackgroundTask task = 1;
  bytes input = 2 [(buf.validate.field).bytes.max_len = 65536];
}

message HeartbeatTaskRequest {
  string task_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string generation = 2 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})$"];
  string worker_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message HeartbeatTaskResponse {
  BackgroundTask task = 1;
}

message SubmitTaskResultRequest {
  string task_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string generation = 2 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})$"];
  string worker_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string input_digest = 4 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
  bool succeeded = 5;
  string result_ref = 6 [(buf.validate.field).string = {max_len: 512}];
  string result_digest = 7 [(buf.validate.field).string.pattern = "^(sha256:[0-9a-f]{64})?$"];
  optional string failure_code = 8 [(buf.validate.field).string = {max_len: 64}];
}

message SubmitTaskResultResponse {
  BackgroundTask task = 1;
  bool accepted = 2;
  bool existing = 3;
}

message GetTaskRequest {
  string task_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetTaskResponse {
  BackgroundTask task = 1;
}
