# oapi-codegen v2 configuration for the public API bindings consumed by
# anvilkit-agent-api. The SSE operations are excluded from the strict
# server because they stream; the API registers those routes by hand and the
# kin-openapi middleware still validates them against the embedded spec.
package: agentapi
generate:
  models: true
  gin-server: true
  strict-server: true
  embedded-spec: true
output-options:
  skip-prune: true
  exclude-operation-ids:
    - streamOperationEvents
    - streamConversationEvents
