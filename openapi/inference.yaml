openapi: 3.0.3
info:
  title: AnvilKit Inference API
  version: "1"
  description: |
    Compute HTTP contract of anvilkit-agent-inference (contracts.md §1, DD-07 §1). Fixed embedding and
    reranking models only; the service accepts no model path, download URL, Qdrant connection or
    business identity. Knowledge is the only caller. Outputs bind inputDigest and modelRevision so a
    stale mismatch is rejected by the caller. Numbers here are model scores, never money or counters.
servers:
  - url: /api/v1
security:
  - mtls: []
paths:
  /embeddings:
    post:
      operationId: createEmbeddings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbeddingRequest" }
      responses:
        "200":
          description: Dense and sparse vectors for every input, in order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbeddingResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /rerankings:
    post:
      operationId: createRerankings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RerankRequest" }
      responses:
        "200":
          description: Scores per candidate, in input order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RerankResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    mtls:
      type: http
      scheme: bearer
      description: Workload mTLS identity (Knowledge only); documented as bearer for tooling, enforced by the gateway/CNI.
  responses:
    Error:
      description: Error envelope (same shape as the public API).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    Id: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$" }
    Digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId, retryable]
          properties:
            code: { type: string, enum: [INVALID_ARGUMENT, CAPACITY_EXHAUSTED, PROFILE_UNQUALIFIED, DEPENDENCY_UNAVAILABLE] }
            message: { type: string, maxLength: 512 }
            requestId: { $ref: "#/components/schemas/Id" }
            retryable: { type: boolean }
    ComputeIdentity:
      description: Task identity Knowledge binds the computation to; never a business identity.
      type: object
      additionalProperties: false
      required: [taskId, generation, profileId]
      properties:
        taskId: { $ref: "#/components/schemas/Id" }
        generation: { type: string, pattern: "^(0|[1-9][0-9]{0,19})$" }
        profileId: { $ref: "#/components/schemas/Id" }
    EmbeddingRequest:
      type: object
      additionalProperties: false
      required: [compute, inputKind, inputs, inputDigest]
      properties:
        compute: { $ref: "#/components/schemas/ComputeIdentity" }
        inputKind: { type: string, enum: [query, passage] }
        inputs:
          type: array
          minItems: 1
          maxItems: 128
          items: { type: string, minLength: 1, maxLength: 32768 }
        inputDigest: { $ref: "#/components/schemas/Digest" }
    SparseVector:
      type: object
      additionalProperties: false
      required: [indices, values]
      properties:
        indices: { type: array, maxItems: 8192, items: { type: integer, minimum: 0 } }
        values: { type: array, maxItems: 8192, items: { type: number } }
    EmbeddingResponse:
      type: object
      additionalProperties: false
      required: [modelId, modelRevision, dimensions, inputDigest, dense, sparse]
      properties:
        modelId: { type: string, enum: [bge-m3] }
        modelRevision: { type: string, minLength: 1, maxLength: 128 }
        dimensions: { type: integer, minimum: 1 }
        inputDigest: { $ref: "#/components/schemas/Digest" }
        dense: { type: array, items: { type: array, items: { type: number } } }
        sparse: { type: array, items: { $ref: "#/components/schemas/SparseVector" } }
    RerankRequest:
      type: object
      additionalProperties: false
      required: [compute, query, candidates, inputDigest]
      properties:
        compute: { $ref: "#/components/schemas/ComputeIdentity" }
        query: { type: string, minLength: 1, maxLength: 8192 }
        candidates:
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [candidateId, text]
            properties:
              candidateId: { $ref: "#/components/schemas/Id" }
              text: { type: string, minLength: 1, maxLength: 32768 }
        inputDigest: { $ref: "#/components/schemas/Digest" }
    RerankResponse:
      type: object
      additionalProperties: false
      required: [modelId, modelRevision, inputDigest, scores]
      properties:
        modelId: { type: string, enum: [bge-reranker-v2-m3] }
        modelRevision: { type: string, minLength: 1, maxLength: 128 }
        inputDigest: { $ref: "#/components/schemas/Digest" }
        scores:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [candidateId, score]
            properties:
              candidateId: { $ref: "#/components/schemas/Id" }
              score: { type: number }
