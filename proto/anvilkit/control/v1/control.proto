// Control is the sole writer of the Control database and the authority for
// operation intake, tracked control commands, attempts, physical instances,
// launch inventory and accepted results. Values follow contracts.md §4: IDs are
// opaque strings, revisions and sequences are canonical unsigned decimal strings,
// money is a fixed-scale (6) integer quantity carried as a decimal string, and
// digests are "sha256:" followed by 64 lowercase hexadecimal characters.
//
// Public JSON served by the API is mapped from these messages by the API; it is
// not ProtoJSON. Field numbers are never reused and enums are never reinterpreted.
syntax = "proto3";

package anvilkit.control.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Shared values
// ---------------------------------------------------------------------------

// CommandIdentity makes a durable command reentrant: the same tenant/command
// pair with the same request digest returns the original outcome, a changed
// digest is an IDEMPOTENCY_CONFLICT (gRPC ABORTED).
message CommandIdentity {
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string command_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string actor_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string request_digest = 4 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
}

// Scope is the verified caller scope. It is established by the API from the
// authenticated principal; a caller-supplied tenant is never authorization.
message Scope {
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string project_id = 2 [(buf.validate.field).string = {max_len: 128}];
  string actor_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

// Money is an integer quantity at scale 6 carried as a decimal string. It is
// never a floating point number in any runtime.
message Money {
  string currency = 1 [(buf.validate.field).string.pattern = "^[A-Z]{3}$"];
  string amount = 2 [(buf.validate.field).string.pattern = "^-?(0|[1-9][0-9]{0,29})$"];
}

// ArtifactBinding names a finalized transfer and the digest the caller
// expects it to hold (the public ArtifactBinding of agent.yaml).
message ArtifactBinding {
  string transfer_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string digest = 2 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
}

// SourceReference names an exact revision of a Knowledge source (a brand or
// asset reference of a preparation). Retrieved text is input, never
// authorization: the reference is recorded, its content digest is frozen by
// the brief.
message SourceReference {
  string source_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string revision = 2 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})$"];
}

// PreparationIntake is what API-01 accepts into a Preparation operation: the
// prompt (a finalized transfer of class prompt) and the selected references.
message PreparationIntake {
  ArtifactBinding prompt = 1 [(buf.validate.field).required = true];
  repeated SourceReference brand_references = 2 [(buf.validate.field).repeated.max_items = 16];
  repeated SourceReference asset_references = 3 [(buf.validate.field).repeated.max_items = 64];
}

// Question is one clarification question of a grouped round.
message Question {
  string question_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string text = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
}

// Clarification is the open question set a waiting Preparation exposes on
// its projection: identity, revision, round, when it was asked and the
// immutable absolute expiry of the wait (DD-01 §3).
message Clarification {
  string question_set_id = 1;
  string question_set_revision = 2;
  string round = 3;
  google.protobuf.Timestamp asked_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  repeated Question questions = 6;
}

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_PREPARATION = 1;
  OPERATION_KIND_GENERATION = 2;
  OPERATION_KIND_REFINEMENT = 3;
  OPERATION_KIND_PREVIEW_BUILD = 4;
  OPERATION_KIND_RELEASE = 5;
  // LocalCheck is a fixed qualification fixture, never a business success.
  OPERATION_KIND_LOCAL_CHECK = 6;
}

enum Lifecycle {
  LIFECYCLE_UNSPECIFIED = 0;
  LIFECYCLE_ACCEPTED = 1;
  LIFECYCLE_RUNNING = 2;
  LIFECYCLE_WAITING = 3;
  LIFECYCLE_RECONCILING = 4;
  LIFECYCLE_SUSPENDED = 5;
  LIFECYCLE_SUCCEEDED = 6;
  LIFECYCLE_FAILED = 7;
  LIFECYCLE_CANCELED = 8;
}

// ControlState separates a tracked control intent from its application.
enum ControlState {
  CONTROL_STATE_UNSPECIFIED = 0;
  CONTROL_STATE_NONE = 1;
  CONTROL_STATE_CANCEL_PENDING = 2;
  CONTROL_STATE_CANCEL_APPLIED = 3;
  CONTROL_STATE_HOLD_PENDING = 4;
  CONTROL_STATE_HOLD_APPLIED = 5;
}

enum CleanupState {
  CLEANUP_STATE_UNSPECIFIED = 0;
  CLEANUP_STATE_NOT_REQUIRED = 1;
  CLEANUP_STATE_PENDING = 2;
  CLEANUP_STATE_COMPLETE = 3;
  CLEANUP_STATE_UNKNOWN = 4;
}

enum FinanceState {
  FINANCE_STATE_UNSPECIFIED = 0;
  FINANCE_STATE_NOT_FUNDED = 1;
  FINANCE_STATE_FUNDED = 2;
  FINANCE_STATE_SETTLING = 3;
  FINANCE_STATE_SETTLED = 4;
  FINANCE_STATE_EXPOSURE_UNKNOWN = 5;
}

// OperationSubject binds the exact profile and subject digest an operation was
// accepted for. A changed subject is a different operation.
message OperationSubject {
  string profile_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string subject_digest = 2 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
  optional string brief_id = 3 [(buf.validate.field).string = {max_len: 128}];
  optional string source_revision = 4 [(buf.validate.field).string = {max_len: 128}];
}

// OperationView is the single committed projection the API exposes.
message OperationView {
  string operation_id = 1;
  string tenant_id = 2;
  string project_id = 3;
  string actor_id = 4;
  OperationKind kind = 5;
  OperationSubject subject = 6;
  Lifecycle lifecycle = 7;
  string phase = 8;
  ControlState control = 9;
  CleanupState cleanup = 10;
  FinanceState finance = 11;
  string revision = 12;
  string covered_event_seq = 13;
  string execution_epoch = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  google.protobuf.Timestamp deadline = 17;
  optional string failure_code = 18;
  // active_deadline is set once by the first execution permit of a
  // Generation (DD-01 §4) and never reset; absent until then and for
  // profiles without an execution queue.
  optional google.protobuf.Timestamp active_deadline = 19;
  // clarification is the open question set of a waiting Preparation.
  optional Clarification clarification = 20;
}

// OperationChangedPayload is the reviewed small payload of operation.changed.
message OperationChangedPayload {
  Lifecycle lifecycle = 1;
  string phase = 2;
  ControlState control = 3;
  CleanupState cleanup = 4;
  FinanceState finance = 5;
  optional string failure_code = 6;
}

message OperationEvent {
  string operation_id = 1;
  string event_seq = 2;
  string transition_id = 3;
  string event_type = 4;
  string revision = 5;
  google.protobuf.Timestamp occurred_at = 6;
  oneof payload {
    OperationChangedPayload operation_changed = 10;
  }
}

enum CommandKind {
  COMMAND_KIND_UNSPECIFIED = 0;
  COMMAND_KIND_CANCEL = 1;
  COMMAND_KIND_HOLD = 2;
  COMMAND_KIND_RESUME = 3;
  COMMAND_KIND_CHANGE_DEFINITION = 4;
}

enum CommandOutcome {
  COMMAND_OUTCOME_UNSPECIFIED = 0;
  COMMAND_OUTCOME_PENDING = 1;
  COMMAND_OUTCOME_APPLIED = 2;
  COMMAND_OUTCOME_BLOCKED = 3;
  COMMAND_OUTCOME_REJECTED = 4;
}

message CommandReceipt {
  string command_id = 1;
  string operation_id = 2;
  CommandKind kind = 3;
  CommandOutcome outcome = 4;
  string operation_revision = 5;
  optional string reason_code = 6;
  google.protobuf.Timestamp accepted_at = 7;
  optional google.protobuf.Timestamp settled_at = 8;
}

// ---------------------------------------------------------------------------
// OperationService: intake, projection, events and tracked commands
// ---------------------------------------------------------------------------

service OperationService {
  // Accepts an operation only after the intake inventory is confirmed. The same
  // command identity and digest returns the original operation with existing=true.
  rpc CreateOperation(CreateOperationRequest) returns (CreateOperationResponse);
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  // Lists durable events after a cursor. A cursor before retention returns
  // reset_required=true with the covered_event_seq of a fresh snapshot.
  rpc ListOperationEvents(ListOperationEventsRequest) returns (ListOperationEventsResponse);
  // Streams durable events after a cursor until the operation is terminal or
  // the caller disconnects; slow consumers are disconnected, never the operation.
  rpc StreamOperationEvents(StreamOperationEventsRequest) returns (stream StreamOperationEventsResponse);
  // Records a tracked control command. Acceptance is not application.
  rpc SubmitCommand(SubmitCommandRequest) returns (SubmitCommandResponse);
  rpc GetCommand(GetCommandRequest) returns (GetCommandResponse);
}

message CreateOperationRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  Scope scope = 2 [(buf.validate.field).required = true];
  OperationKind kind = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  OperationSubject subject = 4 [(buf.validate.field).required = true];
  // preparation carries the intake of a Preparation (API-01); required for
  // that kind, refused for every other.
  optional PreparationIntake preparation = 5;
}

message CreateOperationResponse {
  OperationView operation = 1;
  bool existing = 2;
}

message GetOperationRequest {
  Scope scope = 1 [(buf.validate.field).required = true];
  string operation_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetOperationResponse {
  OperationView operation = 1;
}

message ListOperationEventsRequest {
  Scope scope = 1 [(buf.validate.field).required = true];
  string operation_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Empty means from the beginning of retained history.
  string after_event_seq = 3 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})?$"];
  uint32 limit = 4 [(buf.validate.field).uint32.lte = 1000];
}

message ListOperationEventsResponse {
  repeated OperationEvent events = 1;
  string covered_event_seq = 2;
  bool reset_required = 3;
}

message StreamOperationEventsRequest {
  Scope scope = 1 [(buf.validate.field).required = true];
  string operation_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string after_event_seq = 3 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})?$"];
}

message StreamOperationEventsResponse {
  OperationEvent event = 1;
}

message SubmitCommandRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  Scope scope = 2 [(buf.validate.field).required = true];
  string operation_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  CommandKind kind = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string expected_revision = 5 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})$"];
  optional string target_definition_activation = 6 [(buf.validate.field).string = {max_len: 128}];
}

message SubmitCommandResponse {
  CommandReceipt receipt = 1;
  bool existing = 2;
}

message GetCommandRequest {
  Scope scope = 1 [(buf.validate.field).required = true];
  string operation_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string command_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetCommandResponse {
  CommandReceipt receipt = 1;
}

// ---------------------------------------------------------------------------
// ExecutionService: attempts, launch inventory, physical instances, results
// ---------------------------------------------------------------------------

enum AttemptState {
  ATTEMPT_STATE_UNSPECIFIED = 0;
  ATTEMPT_STATE_OPEN = 1;
  ATTEMPT_STATE_LAUNCH_PREPARED = 2;
  ATTEMPT_STATE_RUNNING = 3;
  ATTEMPT_STATE_RESULT_ACCEPTED = 4;
  ATTEMPT_STATE_CLOSED = 5;
}

enum AttemptOutcome {
  ATTEMPT_OUTCOME_UNSPECIFIED = 0;
  ATTEMPT_OUTCOME_COMPLETED = 1;
  ATTEMPT_OUTCOME_FAILED = 2;
  ATTEMPT_OUTCOME_INFRASTRUCTURE_FAILED = 3;
  ATTEMPT_OUTCOME_CANCELED = 4;
  ATTEMPT_OUTCOME_UNKNOWN = 5;
}

enum InstancePhase {
  INSTANCE_PHASE_UNSPECIFIED = 0;
  INSTANCE_PHASE_PENDING = 1;
  INSTANCE_PHASE_RUNNING = 2;
  INSTANCE_PHASE_SUCCEEDED = 3;
  INSTANCE_PHASE_FAILED = 4;
  INSTANCE_PHASE_UNKNOWN = 5;
}

// Verdict is issued by the trusted observer, never by the candidate.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_CERTIFIED = 1;
  VERDICT_REPAIRABLE = 2;
  VERDICT_INVALID = 3;
  VERDICT_INFRASTRUCTURE_FAILED = 4;
  VERDICT_CANCELED = 5;
}

message Attempt {
  string attempt_id = 1;
  string operation_id = 2;
  string step_id = 3;
  string visit_ordinal = 4;
  string attempt_ordinal = 5;
  string profile_id = 6;
  string execution_epoch = 7;
  AttemptState state = 8;
  AttemptOutcome outcome = 9;
  google.protobuf.Timestamp deadline = 10;
  optional string accepted_stage_id = 11;
  optional string failure_code = 12;
}

message PhysicalInstance {
  string instance_id = 1;
  string attempt_id = 2;
  string launch_key = 3;
  string backend = 4;
  string job_uid = 5;
  string pod_uid = 6;
  string image_digest = 7;
  string launch_epoch = 8;
  InstancePhase phase = 9;
  bool current = 10;
  optional int32 exit_code = 11;
  google.protobuf.Timestamp registered_at = 12;
  optional google.protobuf.Timestamp observed_at = 13;
}

// ArtifactReference is one finalized artifact an accepted stage binds:
// the transfer (by handle, as the result manifest names it), its class, the
// digest and size Control verified and the exact object version it holds.
message ArtifactReference {
  string handle = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string class = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  string digest = 3 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
  string size_bytes = 4 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})$"];
  string transfer_id = 5;
  string object_version = 6;
}

message AcceptedStage {
  string stage_id = 1;
  string attempt_id = 2;
  string instance_id = 3;
  string phase_ordinal = 4;
  Verdict verdict = 5;
  string result_digest = 6;
  string observer_identity = 7;
  string profile_id = 8;
  google.protobuf.Timestamp accepted_at = 9;
  optional string failure_code = 10;
  // The epochs the stage was accepted under and the finalized artifacts it
  // binds (every handle the result manifest names, verified).
  string execution_epoch = 11;
  string recovery_epoch = 12;
  repeated ArtifactReference artifacts = 13;
}

service ExecutionService {
  // Opens a logical attempt for a step visit under the current execution epoch.
  rpc OpenAttempt(OpenAttemptRequest) returns (OpenAttemptResponse);
  // Persists the job-launch obligation before any Kubernetes create. A fenced or
  // terminal operation denies with STALE_EXECUTION (FAILED_PRECONDITION).
  rpc PrepareLaunch(PrepareLaunchRequest) returns (PrepareLaunchResponse);
  // Registers real backend identities (Job UID, Pod UID, image) observed by the
  // trusted launcher. A second Pod for the same launch is registered but only
  // the first current instance can own results.
  rpc RegisterInstance(RegisterInstanceRequest) returns (RegisterInstanceResponse);
  rpc ObserveInstance(ObserveInstanceRequest) returns (ObserveInstanceResponse);
  // Accepts one result per attempt from the current instance under the
  // current epochs. Every artifact the result manifest names by handle must
  // be a finalized transfer of the same scope, class, digest and size; the
  // accepted stage binds those exact object versions. Same digest is
  // idempotent; a different digest for the same attempt is ABORTED.
  rpc AcceptResult(AcceptResultRequest) returns (AcceptResultResponse);
  rpc GetAcceptedStage(GetAcceptedStageRequest) returns (GetAcceptedStageResponse);
  // Reads the physical instance the trusted launcher registered for one Pod
  // of a launch, with its attempt and scope: the trusted access sidecar's
  // lookup of its own execution scope (DD-03 §4, P09). The Pod's own claim
  // registers nothing; until the launcher's evidence is recorded the answer
  // is NOT_FOUND, and an instance that is not current carries no authority.
  rpc GetInstance(GetInstanceRequest) returns (GetInstanceResponse);
  // Closes the attempt with its outcome and cleanup evidence and settles the
  // operation lifecycle for single-attempt profiles. For a multi-step
  // profile (Preparation, Generation) a definite close settles the attempt
  // only; the operation stays running until SettleOperation, an applied
  // cancel or an unknown outcome/cleanup (reconciling) ends it.
  rpc CloseAttempt(CloseAttemptRequest) returns (CloseAttemptResponse);
  // Settles the business outcome of a multi-step operation (DD-01 §2: the
  // Workflow states the business completion; cleanup, settlement and
  // Temporal closure stay separate facts). The same command returns the
  // original; a terminal operation answers its state.
  rpc SettleOperation(SettleOperationRequest) returns (SettleOperationResponse);
}

message OpenAttemptRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  string operation_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string step_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string visit_ordinal = 4 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})$"];
  string profile_id = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message OpenAttemptResponse {
  Attempt attempt = 1;
  bool existing = 2;
}

message PrepareLaunchRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  string attempt_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string launch_key = 3 [(buf.validate.field).string.pattern = "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"];
  string backend = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string image_digest = 5 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
  google.protobuf.Timestamp deadline = 6 [(buf.validate.field).required = true];
}

message PrepareLaunchResponse {
  string launch_id = 1;
  string attempt_id = 2;
  string launch_key = 3;
  string launch_epoch = 4;
  string inventory_version = 5;
  bool existing = 6;
}

message RegisterInstanceRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  string attempt_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string launch_key = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
  }];
  string backend = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string job_uid = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string pod_uid = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string image_digest = 7 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
}

message RegisterInstanceResponse {
  PhysicalInstance instance = 1;
  bool existing = 2;
}

message ObserveInstanceRequest {
  string attempt_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string instance_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  InstancePhase phase = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional int32 exit_code = 4;
  google.protobuf.Timestamp observed_at = 5 [(buf.validate.field).required = true];
}

message ObserveInstanceResponse {
  PhysicalInstance instance = 1;
}

message AcceptResultRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  string attempt_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string instance_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string profile_id = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  Verdict verdict = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string result_digest = 6 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
  // The reviewed small result manifest (contracts/jobs schema); bounded.
  bytes result_manifest = 7 [(buf.validate.field).bytes.max_len = 16384];
  string observer_identity = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  optional string failure_code = 9 [(buf.validate.field).string = {max_len: 64}];
  // The execution epoch the observer acted under; a stage is accepted only
  // under the operation's current epoch. Empty keeps the pre-P08 behavior
  // (the attempt's own epoch is compared with the operation's).
  string execution_epoch = 10 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,19})?$"];
}

message AcceptResultResponse {
  AcceptedStage stage = 1;
  bool existing = 2;
}

message GetAcceptedStageRequest {
  string attempt_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // When set, the stage must belong to this tenant; a stage of another
  // tenant is not found.
  string tenant_id = 2 [(buf.validate.field).string = {max_len: 128}];
  // When set, the stage must be the accepted stage of an attempt of this
  // operation (the authorized relationship of a cross-attempt read, P13):
  // a stage of another operation is not found.
  string operation_id = 3 [(buf.validate.field).string = {max_len: 128}];
}

message GetAcceptedStageResponse {
  AcceptedStage stage = 1;
}

message GetInstanceRequest {
  string backend = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string launch_key = 2 [(buf.validate.field).string.pattern = "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"];
  string pod_uid = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetInstanceResponse {
  PhysicalInstance instance = 1;
  Attempt attempt = 2;
  string tenant_id = 3;
  // The operation's current recovery epoch at the time of the read.
  string recovery_epoch = 4;
  // The attempt's operation as of the same read: its lifecycle, control
  // intent, current execution epoch and deadline are what decide whether
  // the registered instance still holds execution authority (a fenced,
  // terminal or reconciling operation, or an execution epoch past the
  // attempt's, ends it while the instance row stays the historical record
  // of physical ownership).
  OperationView operation = 5;
}

message CloseAttemptRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  string attempt_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  AttemptOutcome outcome = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  CleanupState cleanup = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string failure_code = 5 [(buf.validate.field).string = {max_len: 64}];
}

message CloseAttemptResponse {
  Attempt attempt = 1;
  OperationView operation = 2;
  bool existing = 3;
}

enum OperationOutcome {
  OPERATION_OUTCOME_UNSPECIFIED = 0;
  OPERATION_OUTCOME_SUCCEEDED = 1;
  OPERATION_OUTCOME_FAILED = 2;
  OPERATION_OUTCOME_CANCELED = 3;
}

message SettleOperationRequest {
  CommandIdentity command = 1 [(buf.validate.field).required = true];
  string operation_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  OperationOutcome outcome = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string failure_code = 4 [(buf.validate.field).string = {max_len: 64}];
  // phase is the business phase the outcome ends in (for example
  // candidate_ready, brief_frozen); bounded like the projection's phase.
  string phase = 5 [(buf.validate.field).string = {max_len: 64}];
}

message SettleOperationResponse {
  OperationView operation = 1;
  bool existing = 2;
}
